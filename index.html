}

// 複数の短い区間を1回分(最大約29秒)にまとめて認識する。Whisperは毎回30秒分を計算するため、まとめるほど速い
async function transcribePacked(data, sr, pieces) {
  const PAD = 0.2, GAP = 1.0;
  let total = 0;
  const map = [];
  for (const [s, e] of pieces) {
    const a = Math.max(0, Math.floor((s - PAD) * sr)), b = Math.min(data.length, Math.floor((e + PAD) * sr));
    map.push({ o0: total / sr, o1: (total + b - a) / sr, a, b, src0: a / sr });
    total += (b - a) + Math.floor(GAP * sr);
  }
  const buf = new Float32Array(total);
  for (const m of map) {
    const off = Math.round(m.o0 * sr);
    if (data instanceof Int16Array) for (let i = m.a; i < m.b; i++) buf[off + i - m.a] = data[i] / 32768;
    else buf.set(data.subarray(m.a, m.b), off);
  }
  const id = ++ASR.seq;
  const out = await new Promise((resolve, reject) => {
    ASR.pending.set(id, { resolve, reject });
    ASR.worker.postMessage({ type: 'run', id, audio: buf }, [buf.buffer]);
  });
  const toSrc = t => {
    let best = map[0];
    for (const m of map) if (t >= m.o0 - GAP / 2) best = m;
    return best.src0 + Math.max(0, t - best.o0);
  };
  return (out.chunks || []).map(c => {
    const t0 = c.timestamp?.[0] ?? 0, t1 = c.timestamp?.[1] ?? t0 + 3;
    return { text: c.text, s: toSrc(t0), e: toSrc(Math.max(t0, t1 - 0.01)) };
  });
}

// ===== 音(読み)による札の照合 =====
// Whisperは同じ音でも違う漢字を当てるため、聞き取った文字を読み(ひらがな)に直してから、
// 百人一首の上の句・下の句の読みと「音の近さ」で比べる。
const PH_KANA_FIX = { 'を': 'お', 'ゐ': 'い', 'ゑ': 'え', 'ぢ': 'じ', 'づ': 'ず', 'ゎ': 'わ' };
const PH_VOWEL = {};
'あかさたなはまやらわがざだばぱゃぁ'.split('').forEach(c => PH_VOWEL[c] = 'a');
'いきしちにひみりぎじびぴぃ'.split('').forEach(c => PH_VOWEL[c] = 'i');
'うくすつぬふむゆるぐずぶぷゅぅっ'.split('').forEach(c => PH_VOWEL[c] = 'u');
'えけせてねへめれげぜでべぺぇ'.split('').forEach(c => PH_VOWEL[c] = 'e');
'おこそとのほもよろごぞどぼぽょぉ'.split('').forEach(c => PH_VOWEL[c] = 'o');
const phSeion = s => s.normalize('NFD').replace(/[゙゚]/g, '').normalize('NFC');
const phHira = s => String(s).normalize('NFKC').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function phNorm(s) {
  s = phHira(s);
  let out = '';
  for (const ch of s) {
    if (ch === 'ー') { const v = PH_VOWEL[out[out.length - 1]]; out += v ? ({ a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お' }[v] || '') : ''; continue; }
    if (!/[ぁ-ゖ]/.test(ch)) continue;
    out += PH_KANA_FIX[ch] || ch;
  }
  return out.replace(/([おこそとのほもよろごぞどぼぽょ])う/g, '$1お').replace(/([えけせてねへめれげぜでべぺ])い/g, '$1え');
}
// 歴史的仮名づかい → 発音(おおまかな規則)
function phHistToModern(s) {
  return s.split(/\s+/).map(w => w.replace(/(?!^)[はひふへほ]/g, c => ({ は: 'わ', ひ: 'い', ふ: 'う', へ: 'え', ほ: 'お' }[c]))
    .replace(/てう/g, 'ちょう').replace(/けう/g, 'きょう').replace(/[ゐゑをぢづ]/g, c => PH_KANA_FIX[c])).join('');
}
function phCharSim(a, b) {
  if (a === b) return 2;
  if (phSeion(a) === phSeion(b)) return 1;
  if (PH_VOWEL[a] && PH_VOWEL[a] === PH_VOWEL[b]) return 0.3;
  return -1;
}
// 局所アラインメント(一番よく一致する部分の得点)
function phAlign(q, t) {
  const n = q.length, m = t.length;
  let prev = new Float32Array(m + 1), cur = new Float32Array(m + 1), best = 0;
  for (let i = 1; i <= n; i++) {
    cur[0] = 0;
    for (let j = 1; j <= m; j++) {
      const v = Math.max(0, prev[j - 1] + phCharSim(q[i - 1], t[j - 1]), prev[j] - 1, cur[j - 1] - 1);
      cur[j] = v; if (v > best) best = v;
    }
    [prev, cur] = [cur, prev];
  }
  return best;
}

// 形態素解析(kuromoji)を別スレッドで動かして、漢字まじりの文を読みに変換する
const KUROMOJI_WORKER_SRC = `
importScripts('https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js');
let tk = null, queue = [];
kuromoji.builder({ dicPath: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/' }).build((err, t) => {
  if (err) { postMessage({ type: 'error', message: String(err) }); return; }
  tk = t; postMessage({ type: 'ready' }); queue.forEach(run); queue = [];
});
function run(m) {
  const out = m.texts.map(s => tk.tokenize(String(s || '')).map(x => (x.pronunciation && x.pronunciation !== '*') ? x.pronunciation : x.surface_form).join(''));
  postMessage({ type: 'result', id: m.id, out });
}
onmessage = e => { if (tk) run(e.data); else queue.push(e.data); };`;
const PH = { worker: null, ready: null, seq: 0, pending: new Map(), forms: null };
function phStart() {
  if (PH.ready) return PH.ready;
  PH.ready = new Promise((resolve, reject) => {
    const w = new Worker(URL.createObjectURL(new Blob([KUROMOJI_WORKER_SRC], { type: 'text/javascript' })));
    PH.worker = w;
    const to = setTimeout(() => reject(new Error('読み変換の辞書を読み込めませんでした(時間切れ)')), 120000);
    w.onmessage = e => {
      const m = e.data;
      if (m.type === 'ready') { clearTimeout(to); resolve(); }
      else if (m.type === 'error') { clearTimeout(to); reject(new Error(m.message)); }
      else if (m.type === 'result') { const p = PH.pending.get(m.id); PH.pending.delete(m.id); p?.(m.out); }
    };
    w.onerror = e => { clearTimeout(to); reject(new Error(e.message || '読み変換の準備に失敗しました')); };
  });
  PH.ready.catch(() => { PH.ready = null; });
  return PH.ready;
}
async function phPron(texts) {
  await phStart();
  const id = ++PH.seq;
  return new Promise(res => { PH.pending.set(id, res); PH.worker.postMessage({ id, texts }); });
}
// 各札の上の句・下の句の読み(複数の表記から作る)
async function phForms() {
  if (PH.forms) return PH.forms;
  const idx = [];
  for (let no = 0; no <= 100; no++) idx.push(no);
  const pr = await phPron(idx.map(no => POEMS[no].kami.replace(/\s/g, '')).concat(idx.map(no => POEMS[no].shimo.replace(/\s/g, ''))));
  const forms = [];
  idx.forEach((no, i) => {
    const p = POEMS[no];
    forms.push({ no, part: 'k', y: [...new Set([phNorm(p.kamiYomi), phNorm(phHistToModern(p.kamiKana)), phNorm(pr[i])])] });
    forms.push({ no, part: 's', y: [...new Set([phNorm(phHistToModern(p.shimoKana)), phNorm(pr[idx.length + i])])] });
  });
  PH.forms = forms;
  return forms;
}
// 局所アラインメント(位置つき):一致した部分が、聞き取り文 q と札の読み t のどこかも返す
function phAlignSpan(q, t) {
  const n = q.length, m = t.length;
  let pv = new Float32Array(m + 1), cv = new Float32Array(m + 1);
  let pI = new Int32Array(m + 1), pJ = new Int32Array(m + 1), cI = new Int32Array(m + 1), cJ = new Int32Array(m + 1);
  const b = { sc: 0, qs: 0, qe: 0, ts: 0, te: 0 };
  for (let i = 1; i <= n; i++) {
    cv[0] = 0;
    for (let j = 1; j <= m; j++) {
      const d = pv[j - 1] + phCharSim(q[i - 1], t[j - 1]), u = pv[j] - 1, l = cv[j - 1] - 1;
      let v = 0, si = 0, sj = 0;
      if (d > 0 && d >= u && d >= l) { v = d; if (pv[j - 1] === 0) { si = i - 1; sj = j - 1; } else { si = pI[j - 1]; sj = pJ[j - 1]; } }
      else if (u > 0 && u >= l) { v = u; si = pI[j]; sj = pJ[j]; }
      else if (l > 0) { v = l; si = cI[j - 1]; sj = cJ[j - 1]; }
      cv[j] = v; cI[j] = si; cJ[j] = sj;
      if (v > b.sc) { b.sc = v; b.qs = si; b.qe = i; b.ts = sj; b.te = j; }
    }
    [pv, cv] = [cv, pv]; [pI, cI] = [cI, pI]; [pJ, cJ] = [cJ, pJ];
  }
  return b;
}
// 読み(ひらがな)1つに対する各札の一致度(旧方式:文全体)
function phScore(q, forms) {
  if (q.length < 3) return [];
  const L = Math.max(6, Math.min(q.length, 17));
  return forms.map(f => ({ no: f.no, part: f.part, score: +(Math.max(...f.y.map(y => phAlign(q, y))) / (2 * L)).toFixed(3) }))
    .sort((a, b) => b.score - a.score);
}
// 1つの聞き取り文から、上の句・下の句の「当たり」を位置つきで順に取り出す
// (空札では「上の句の途中→下の句→次の札の上の句」が1つの文にまとまるため、複数の当たりを拾う)
function phHits(q, forms) {
  const out = [];
  if (q.length < 3) return out;
  const cands = [];
  for (const f of forms) {
    let best = null;
    for (const y of f.y) {
      const a = phAlignSpan(q, y);
      const L = Math.max(7, Math.min(a.te - a.ts, 17));
      let s = a.sc / (2 * L);
      // 上の句の出だし(決まり字)から一致しているものは信頼度を上げる
      const head = f.part === 'k' && a.ts <= 1;
      if (head) s += 0.06;
      if (a.sc < (head ? 8 : 10)) continue;
      if (!best || s > best.score) best = { no: f.no, part: f.part, score: +Math.min(1, s).toFixed(3), qs: a.qs, qe: a.qe, head, key: a.sc + (head ? 3 : 0) };
    }
    if (best && best.score >= 0.4) cands.push(best);
  }
  // 重なる当たりは「一致した長さ」が大きいほうを残す(短い部分一致より、長く一致した句を優先)
  cands.sort((a, b) => b.key - a.key || b.score - a.score);
  const taken = [];
  for (const c of cands) {
    const ov = taken.some(t => {
      if (t.no === c.no && t.part !== c.part) return false; // 同じ札の上の句と下の句は両方残す
      const o = Math.min(t.qe, c.qe) - Math.max(t.qs, c.qs);
      return o > 0.5 * Math.min(t.qe - t.qs, c.qe - c.qs);
    });
    if (ov) {
      // 同じ位置の2番目の候補は、候補一覧用に残す
      const t0 = taken.find(t => Math.min(t.qe, c.qe) - Math.max(t.qs, c.qs) > 0);
      if (t0) { (t0.alt = t0.alt || []).push(c); }
      continue;
    }
    taken.push(c);
  }
  return taken.sort((a, b) => a.qs - b.qs);
}
// 読み以外(拍手・畳の音・話し声・Whisperの空耳)らしい文か
const PH_NOISE = /^(|[\s(()[\]【】♪〜~…・、。]*|.*(ご視聴|ありがとうございま|お疲れ様|よろしくお願い|チャンネル登録|字幕|音楽|拍手).*|[((\[【][^))\]】]*[))\]】])$/;
function phDedupe(s) {
  // 「もう一度 もう一度 …」のような繰り返しの空耳を1回に縮める
  return String(s || '').replace(/(.{2,12}?)(?:\s*\1){2,}/g, '$1').slice(0, 160);
}

// 認識結果から、読みの一覧の札と時刻を判定し直す
// ありあけ(読み上げ機)の順序:…「下の句(前の札)」「上の句(次の札)」…(取り)…
// ・声のまとまり(unit)ごとに、聞き取った文の中の上の句・下の句の並びを調べる
// ・上の句 → そのまとまりで読まれた札(2枚以上なら行を分ける)。時刻はその上の句の読み始め
// ・まとまりの最初の下の句 → 前のまとまりの札の確認
// ・同じ札は1試合に1回だけ。手で決めた札・手で合わせた時刻は変えない
async function rejudgeReads(m, onStatus) {
  const forms = await phForms();
  const reads = m.reads.slice().sort((a, b) => (a.t ?? 1e12) - (b.t ?? 1e12));
  const hasWork = r => r.taker || (r.fault && (r.fault.N || r.fault.F)) || (r.ops && r.ops.length) || (r.react && Object.keys(r.react).length) || r.kimariT != null;
  const isManual = r => r.cardSrc === 'manual' || (r.card != null && hasWork(r));
  const units = m.audio?.units || [];
  // --- 声のまとまりごとに行をまとめる
  const gmap = new Map(), groups = [];
  for (const r of reads) {
    const key = r.unit ? r.unit[0].toFixed(2) + '-' + r.unit[1].toFixed(2) : 'r' + r.id;
    let g = gmap.get(key);
    if (!g) {
      const s = r.unit ? r.unit[0] : (r.t ?? 0), e = r.unit ? r.unit[1] : (r.t ?? 0) + 8;
      const u = units.find(u => Math.abs(u.s - s) < 0.05);
      // 読み始めの候補:0.8秒以上の間で区切った句の頭
      const heads = [];
      (u?.subs || [[s, e]]).forEach((x, k, a) => { if (!k || x[0] - a[k - 1][1] >= 0.8) heads.push(x[0]); });
      g = { key, s, e, heads, rows: [], events: [], hits: [], K: [], shimoSeen: false, anyText: false, loose: [] };
      gmap.set(key, g); groups.push(g);
    }
    g.rows.push(r);
  }
  groups.sort((a, b) => a.s - b.s);
  const groupAt = t => { let k = 0; for (let i = 0; i < groups.length; i++) if (groups[i].s - 1 <= t) k = i; return groups[k]; };
  // --- 聞き取った文(保存されたチャンクがあればそれ、なければ行の認識文)
  const chunks = (m.audio?.asrChunks || []).filter(c => c.text && c.text.trim());
  if (chunks.length) chunks.forEach(c => groupAt(c.s).events.push({ s: c.s, e: c.e, text: c.text }));
  else groups.forEach(g => { const r = g.rows.find(r => r.asr && r.asr.trim()); if (r) g.events.push({ s: g.s, e: g.e, text: r.asr, r }); });
  const evs = groups.flatMap(g => g.events.map(e => ({ g, e })));
  onStatus?.(`読みを照合しています…(${evs.length}件)`);
  const pr = await phPron(evs.map(x => phDedupe(x.e.text)));
  evs.forEach(({ g, e }, i) => {
    const q = phNorm(pr[i]);
    if (!PH_NOISE.test(e.text.trim())) g.anyText = true;
    // 行の認識文が、まとまりの後半だけを聞き取ったもの(文字数が時間に比べて少ない)なら、その行の時刻から数える
    if (e.r && e.r.t > e.s + 0.5 && q.length / Math.max(1, e.e - e.s) < 1.8) e.s = e.r.t;
    const hs = phHits(q, forms);
    // 文の中の位置から時刻を見積もり、近くの句の頭(-5〜+4秒)にそろえる。なければ見積もりのまま
    const when = qs => {
      const t0 = e.s + (e.e - e.s) * (q.length ? qs / q.length : 0);
      let best = null;
      for (const x of g.heads) if (x >= e.s - 0.5 && x >= t0 - 5 && x <= t0 + 4 && (best == null || Math.abs(x - t0) < Math.abs(best - t0))) best = x;
      return best ?? t0;
    };
    hs.forEach(h => {
      h.t = when(h.qs);
      (h.alt || []).forEach(x => { x.t = when(x.qs); });
      g.hits.push(h);
    });
    if (!hs.length && q.length >= 4) g.loose.push(...phScore(q, forms.filter(f => f.part === 'k')).slice(0, 3).filter(x => x.score >= 0.3));
  });
  // --- まとまりの中の上の句・下の句の並びを読む
  const addC = (k, no, s) => { if (k) k.cand.set(no, Math.max(k.cand.get(no) || 0, s)); };
  const mkK = (no, score, t, alt) => { const k = { no, score, t, alt: alt || [], cand: new Map() }; return k; };
  let prevLast = null; // 直前のまとまりの最後の読み
  for (const g of groups) {
    g.hits.sort((a, b) => a.t - b.t || a.qs - b.qs);
    let curK = null;
    for (const h of g.hits) {
      const altHas = (no, part) => (h.alt || []).some(a => a.no === no && a.part === part && a.score >= h.score - 0.15);
      // 下の句から見つけた札は、同じ札の上の句らしい部分があればその時刻を使う
      const newK = sc => { const ak = (h.alt || []).find(a => a.no === h.no && a.part === 'k'); curK = mkK(h.no, sc, ak ? Math.min(ak.t, h.t) : h.t); g.K.push(curK); };
      if (h.part === 'k') {
        if (curK && curK.no === h.no) { curK.score = Math.max(curK.score, h.score); continue; }
        if (curK && altHas(curK.no, 's')) continue; // 実は今の札の下の句
        curK = mkK(h.no, h.score, h.t, h.alt); g.K.push(curK);
      } else {
        if (h.no === 0) { if (!curK || curK.no !== 0) newK(h.score); continue; } // 序歌
        if (curK) {
          if (curK.no === h.no || altHas(curK.no, 's')) { curK.score = Math.max(curK.score, Math.min(1, h.score * 0.8 + 0.2)); continue; }
          if (h.score >= 0.65) newK(h.score * 0.85); // 上の句は聞き取れなかったが、下の句がはっきり聞こえた札
          continue;
        }
        if (h.qs >= 4 && h.score >= 0.6) { newK(h.score * 0.85); continue; }
        // まとまりの最初の下の句 → 前の読みの札
        const pk = prevLast;
        if (pk) {
          if (pk.no === h.no) pk.score = Math.max(pk.score, Math.min(1, pk.score + 0.15), h.score * 0.9);
          else if (pk.no == null) addC(pk, h.no, h.score * 0.9);
          else addC(pk, h.no, h.score * 0.5);
        }
        g.shimoSeen = true;
      }
    }
    // 上の句が見つからないまとまりは「札不明」の読みを1つ置く(下の句だけの場面は置かない)
    if (!g.K.length && !g.shimoSeen) g.K.push(mkK(null, 0, null));
    if (g.K.length) prevLast = g.K[g.K.length - 1];
  }
  // 候補の点(後ろの下の句で点が上がることがあるので、全部読んでから)
  groups.forEach(g => g.K.forEach((k, n) => {
    if (k.no == null) return;
    addC(k, k.no, n === 0 || k.score >= 0.55 ? k.score : k.score * 0.8);
    k.alt.forEach(a => { if (a.part === 'k') addC(k, a.no, Math.min(a.score, k.score - 0.01)); });
  }));
  // --- 読み(K)と行を結びつける
  const links = []; // {k, r(既存の行 or null), g}
  for (const g of groups) {
    const man = g.rows.filter(isManual), auto = g.rows.filter(r => !isManual(r)).sort((a, b) => (a.t ?? 0) - (b.t ?? 0));
    let ks = g.K.slice();
    const take = k => { ks = ks.filter(x => x !== k); };
    for (const r of man) {
      let k = r.card != null ? ks.find(x => x.no === r.card) : null;
      if (!k && ks.length && r.card != null) k = ks.slice().sort((a, b) => Math.abs((a.t ?? r.t) - r.t) - Math.abs((b.t ?? r.t) - r.t))[0];
      if (k) { take(k); links.push({ k, r, g, fixed: true }); }
      else links.push({ k: null, r, g, fixed: true });
    }
    // 前回と同じ札の行はそのまま同じ行に(行の入れ替わりを防ぐ)
    for (const r of auto.slice()) {
      const k = r.card != null ? ks.find(x => x.no === r.card) : null;
      if (k) { take(k); auto.splice(auto.indexOf(r), 1); links.push({ k, r, g }); }
    }
    for (const k of ks) {
      if (k.no == null && !auto.length && man.length) continue; // 手で直した行があるまとまりに「札不明」は足さない
      // 時刻の一番近い行に
      let r = null;
      if (auto.length) { r = k.t == null ? auto[0] : auto.slice().sort((a, b) => Math.abs((a.t ?? 0) - k.t) - Math.abs((b.t ?? 0) - k.t))[0]; auto.splice(auto.indexOf(r), 1); }
      links.push({ k, r, g });
    }
    auto.forEach(r => links.push({ k: null, r, g, extra: true }));
  }
  // --- 同じ札は1回だけ:点の高い順に割り当てる(手で決めた札は固定)
  const used = new Set(links.filter(l => l.fixed).map(l => l.r.card).filter(c => c != null));
  const all = [];
  links.forEach((l, i) => { if (!l.fixed && l.k) l.k.cand.forEach((s, no) => { if (s >= 0.5) all.push([s, i, no]); }); });
  all.sort((a, b) => b[0] - a[0]);
  const assign = new Map();
  for (const [, i, no] of all) { if (assign.has(i) || used.has(no)) continue; assign.set(i, no); used.add(no); }
  let lastG = -1;
  links.forEach((l, i) => { if (assign.has(i) || (l.fixed && l.r.card != null)) lastG = Math.max(lastG, groups.indexOf(l.g)); });
  // --- 行を作り直す
  let assigned = 0, removed = 0, noise = 0, split = 0, moved = 0;
  const keep = [];
  const setT = (r, k) => {
    if (!k || k.t == null || r.tSrc === 'manual') return;
    const t = +k.t.toFixed(2);
    if (r.t == null || Math.abs(r.t - t) > 0.05) { r.t = t; moved++; }
  };
  links.forEach((l, i) => {
    const { k, g } = l;
    let r = l.r;
    const topOf = () => k ? [...k.cand.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).map(([no, s]) => [no, +Math.min(1, s).toFixed(2)]) : [];
    if (l.fixed) {
      if (r.card != null) assigned++;
      if (k && k.no != null) setT(r, k);
      keep.push(r); return;
    }
    const top = topOf();
    if (assign.has(i)) {
      if (!r) { r = { id: uid(), t: null, unit: [g.s, g.e], card: null, taker: null, fault: {}, ops: [], react: {}, asr: g.rows[0]?.asr }; split++; }
      r.card = assign.get(i); r.cardSrc = 'auto'; r.cand = top; assigned++;
      setT(r, k); keep.push(r); return;
    }
    if (!r) return; // 新しく分けた行で札が決まらないもの
    if (hasWork(r)) { r.card = null; r.cand = top; keep.push(r); return; }
    if (l.extra) { removed++; return; } // 以前に分けた行で、今回は読みが見つからないもの
    const gi = groups.indexOf(g), weak = !top.length || top[0][1] < 0.45;
    if (g.shimoSeen && !(k && k.no != null)) { removed++; return; } // 下の句だけの場面
    if (lastG >= 0 && gi > lastG && weak) { noise++; return; } // 試合後の会話など
    if (!g.hits.length && !g.anyText) { noise++; return; } // 聞き取れた言葉がない(物音・拍手・音楽など)
    r.card = null;
    if (!top.length && g.loose.length) { const seen = new Set(); r.cand = g.loose.sort((a, b) => b.score - a.score).filter(x => !seen.has(x.no) && seen.add(x.no)).slice(0, 3).map(x => [x.no, Math.min(0.49, x.score)]); }
    else r.cand = top;
    if (k && k.no != null) setT(r, k);
    keep.push(r);
  });
  keep.sort((a, b) => (a.t ?? 1e12) - (b.t ?? 1e12));
  m.reads = keep;
  return { assigned, removed, noise, split, moved, total: keep.length };
}

// ===== 画像から初期配置を読み取る =====
// 1) 白くて彩度の低い四角(取り札)を探す  2) 中央線・上下の境目から、どの選手の何段目の何列目かを決める
// 3) 札ごとに、過去に確定した札の画像(見本)と見比べる + 文字認識(Tesseract)で下の句を読む
// 4) 同じ札は1枚だけになるように割り当てる。自信のない札は黄色・赤で示し、クリックで手直しできる
const VIS = { tess: null, tessReady: null, tmpl: null };
const TW = 30, TH = 42; // 見本画像の大きさ(札を縦向きにしたもの)

// --- 札の検出(ImageData → 札の四角の一覧)
function visDetect(img) {
  const { width: W, height: H, data: d } = img;
  const N = W * H, V = new Uint8Array(N), S = new Uint8Array(N);
  const hist = new Uint32Array(256);
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    const r = d[p], g = d[p + 1], b = d[p + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    V[i] = mx; S[i] = mx ? ((mx - mn) * 255 / mx) | 0 : 0; hist[mx]++;
  }
  let acc = 0, p90 = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= N * 0.9) { p90 = v; break; } }
  const thrV = Math.max(140, p90 - 50);
  let M = new Uint8Array(N);
  for (let i = 0; i < N; i++) M[i] = V[i] > thrV && S[i] < 50 ? 1 : 0;
  // 小さな点を消す(3x3の収縮→膨張)
  const morph = (src, erode) => {
    const t = new Uint8Array(N), o = new Uint8Array(N);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, a = x > 0 ? src[i - 1] : src[i], b = src[i], c = x < W - 1 ? src[i + 1] : src[i];
      t[i] = erode ? a & b & c : a | b | c;
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, a = y > 0 ? t[i - W] : t[i], b = t[i], c = y < H - 1 ? t[i + W] : t[i];
      o[i] = erode ? a & b & c : a | b | c;
    }
    return o;
  };
  M = morph(morph(M, true), false);
  // つながった領域
  const lab = new Int32Array(N), stack = new Int32Array(N);
  const comps = [];
  let id = 0;
  for (let s = 0; s < N; s++) {
    if (!M[s] || lab[s]) continue;
    id++;
    let sp = 0, x0 = W, y0 = H, x1 = 0, y1 = 0, area = 0;
    stack[sp++] = s; lab[s] = id;
    while (sp) {
      const i = stack[--sp], x = i % W, y = (i / W) | 0;
      area++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && M[i - 1] && !lab[i - 1]) { lab[i - 1] = id; stack[sp++] = i - 1; }
      if (x < W - 1 && M[i + 1] && !lab[i + 1]) { lab[i + 1] = id; stack[sp++] = i + 1; }
      if (y > 0 && M[i - W] && !lab[i - W]) { lab[i - W] = id; stack[sp++] = i - W; }
      if (y < H - 1 && M[i + W] && !lab[i + W]) { lab[i + W] = id; stack[sp++] = i + W; }
    }
    comps.push({ id, x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1, area });
  }
  const minArea = N * 0.00015, minLen = Math.max(5, Math.round(Math.max(W, H) / 350));
  let boxes = [];
  for (const c of comps) {
    if (c.area < minArea || c.area / (c.w * c.h) < 0.45) continue;
    // 並んで接している札を、白の割合が下がるところで分ける
    const prof = (axis) => {
      const L = axis ? c.h : c.w, out = new Float32Array(L);
      for (let k = 0; k < L; k++) {
        let n = 0;
        const len = axis ? c.w : c.h;
        for (let j = 0; j < len; j++) {
          const x = axis ? c.x + j : c.x + k, y = axis ? c.y + k : c.y + j;
          if (lab[y * W + x] === c.id) n++;
        }
        out[k] = n / len;
      }
      return out;
    };
    const segs = pr => {
      const out = []; let s = -1;
      for (let k = 0; k <= pr.length; k++) {
        const on = k < pr.length && pr[k] >= 0.55;
        if (on && s < 0) s = k;
        if (!on && s >= 0) { if (k - s >= minLen) out.push([s, k]); s = -1; }
      }
      return out;
    };
    const rows = segs(prof(1)), cols = segs(prof(0));
    for (const [a0, a1] of rows) for (const [b0, b1] of cols) boxes.push({ x: c.x + b0, y: c.y + a0, w: b1 - b0, h: a1 - a0 });
  }
  // 大きさが札らしいものだけ(中央値の0.35〜2.8倍)
  if (boxes.length) {
    const areas = boxes.map(b => b.w * b.h).sort((a, b) => a - b), med = areas[areas.length >> 1];
    boxes = boxes.filter(b => b.w * b.h > med * 0.35 && b.w * b.h < med * 2.8);
    // 縦横比も札らしいものだけ(畳の縁の白い線などを除く)
    if (boxes.length) {
      const asp = boxes.map(b => b.w / b.h).sort((a, b) => a - b), ma = asp[asp.length >> 1];
      boxes = boxes.filter(b => b.w / b.h > ma / 1.6 && b.w / b.h < ma * 1.6);
    }
  }
  return boxes;
}

// 一番広いすき間(両側に札が2割以上ある所)
function visGap(boxes, axis) {
  if (boxes.length < 4) return null;
  const iv = boxes.map(b => axis ? [b.y, b.y + b.h] : [b.x, b.x + b.w]).sort((a, b) => a[0] - b[0]);
  let best = null, reach = iv[0][1];
  for (let i = 1; i < iv.length; i++) {
    const gap = iv[i][0] - reach;
    const before = i, after = iv.length - i;
    if (gap > 0 && before >= iv.length * 0.2 && after >= iv.length * 0.2 && (!best || gap > best.gap)) best = { gap, at: (reach + iv[i][0]) / 2 };
    reach = Math.max(reach, iv[i][1]);
  }
  return best ? best.at : null;
}

// --- 四角 → 盤面のマス(横から撮った向き:左の選手が画面左、その左手側が画面上)
function visAssignSlots(boxes, seamX, midY) {
  const taken = new Set();
  for (const side of ['N', 'F']) {
    const cs = boxes.filter(b => !b.off && (side === 'N' ? b.x + b.w / 2 < seamX : b.x + b.w / 2 >= seamX));
    if (!cs.length) continue;
    const dist = b => side === 'N' ? seamX - (b.x + b.w) : b.x - seamX; // 中央線からの距離
    // 段:上半分・下半分それぞれで、中央線からの距離でまとめる(遠近で札の大きさが違うため別々に)
    for (const top of [true, false]) {
      const sorted = cs.filter(b => (b.y + b.h / 2 < midY) === top).sort((a, b) => dist(a) - dist(b));
      const clusters = [];
      for (const b of sorted) {
        const l = clusters[clusters.length - 1];
        if (l && dist(b) - l.d < 0.5 * b.w) l.items.push(b); else clusters.push({ d: dist(b), items: [b] });
      }
      let row = -1, prevD = null;
      for (const cl of clusters) {
        const w = cl.items.reduce((s, b) => s + b.w, 0) / cl.items.length;
        if (prevD == null) row = cl.d > 0.8 * w ? 1 : 0;
        else row += Math.max(1, Math.round((cl.d - prevD) / (w * 1.08)));
        row = Math.min(2, row); prevD = cl.d;
        cl.items.forEach(b => { b.side = side; b.row = row; });
      }
    }
    // 列:上半分は画面上端から、下半分は画面下端から数える
    for (const top of [true, false]) {
      const hs = cs.filter(b => (b.y + b.h / 2 < midY) === top);
      if (!hs.length) continue;
      const edge = top ? Math.min(...hs.map(b => b.y)) : Math.max(...hs.map(b => b.y + b.h));
      for (let r = 0; r < 3; r++) {
        const rs = hs.filter(b => b.row === r).sort((a, b) => top ? a.y - b.y : (b.y + b.h) - (a.y + a.h));
        // 端からの位置:最初の札は端からの距離で、次からは前の札とのすき間で数える(札どうしが接していれば隣の列)
        let prev = -1, prevEnd = null;
        for (const b of rs) {
          const pitch = b.h * 1.1;
          const near = top ? b.y : b.y + b.h, far = top ? b.y + b.h : b.y;
          const gap = prevEnd == null ? Math.abs(near - edge) : Math.max(0, top ? near - prevEnd : prevEnd - near);
          const idx = prevEnd == null ? Math.round(gap / pitch) : prev + 1 + (gap < 0.5 * b.h ? 0 : Math.round(gap / pitch));
          prev = idx; prevEnd = far;
          b.sr = top ? Math.min(11, idx) : Math.max(0, 11 - idx);
        }
      }
    }
    // 重なりは近くの空きマスへ
    for (const b of cs) {
      let sr = b.sr ?? 0;
      const key = s => slotKey(side, b.row, side === 'N' ? s : 11 - s);
      if (taken.has(key(sr))) {
        for (let d = 1; d < 12; d++) {
          if (sr + d < 12 && !taken.has(key(sr + d))) { sr += d; break; }
          if (sr - d >= 0 && !taken.has(key(sr - d))) { sr -= d; break; }
        }
      }
      b.sr = sr; b.slot = key(sr); taken.add(b.slot);
    }
  }
}

// --- 札の切り出し(縦向き・札の縦横比にそろえる)
function visCrop(src, b, outH) {
  const outW = Math.round(outH * 52 / 73);
  const ix = b.w * 0.05, iy = b.h * 0.05; // 縁の緑を少し除く
  const c = document.createElement('canvas');
  c.width = outW; c.height = outH;
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.translate(outW / 2, outH / 2);
  // 左の選手の札は画面右が札の上 → 反時計回り、右の選手の札は時計回り
  g.rotate(b.side === 'F' ? Math.PI / 2 : -Math.PI / 2);
  g.drawImage(src, b.x + ix, b.y + iy, b.w - 2 * ix, b.h - 2 * iy, -outH / 2, -outW / 2, outH, outW);
  return c;
}
// 文字認識用:余白をつけ、濃淡をはっきりさせる(variant 1)/ 少し内側を切り出すだけ(variant 2)
function visCropOCR(src, b, variant) {
  if (variant === 2) return visCrop(src, b, 300);
  const outH = 300, outW = Math.round(outH * 52 / 73), P = Math.round(outH * 0.08);
  const c = document.createElement('canvas');
  c.width = outW + 2 * P; c.height = outH + 2 * P;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.imageSmoothingQuality = 'high';
  g.translate(c.width / 2, c.height / 2);
  g.rotate(b.side === 'F' ? Math.PI / 2 : -Math.PI / 2);
  g.drawImage(src, b.x, b.y, b.w, b.h, -outH / 2, -outW / 2, outH, outW);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data, n = d.length / 4;
  const gs = new Float32Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) gs[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
  const srt = Float32Array.from(gs).sort(), lo = srt[Math.floor(n * 0.02)], hi = srt[Math.floor(n * 0.6)];
  for (let i = 0, p = 0; i < n; i++, p += 4) { const v = clamp((gs[i] - lo) / ((hi - lo) || 1) * 255, 0, 255); d[p] = d[p + 1] = d[p + 2] = v; }
  g.putImageData(im, 0, 0);
  return c;
}
function visGray(c) {
  const g = c.getContext('2d'), im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  const out = new Float32Array(c.width * c.height);
  for (let i = 0, p = 0; i < out.length; i++, p += 4) out[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
  return out;
}
// 見本との比較用(ぼかして平均0・長さ1にする)
function visVec(px, w = TW, h = TH) {
  const b = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const X = x + dx, Y = y + dy;
      if (X >= 0 && X < w && Y >= 0 && Y < h) { s += px[Y * w + X]; n++; }
    }
    b[y * w + x] = s / n;
  }
  // 端の2ピクセルは使わない
  const v = []; for (let y = 2; y < h - 2; y++) for (let x = 2; x < w - 2; x++) v.push(b[y * w + x]);
  const m = v.reduce((a, c) => a + c, 0) / v.length;
  let nn = 0; for (let i = 0; i < v.length; i++) { v[i] -= m; nn += v[i] * v[i]; }
  nn = Math.sqrt(nn) || 1;
  return Float32Array.from(v, x => x / nn);
}
const visDot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

// --- 見本(過去に確定した札の画像)
async function visLoadTemplates() {
  if (VIS.tmpl) return VIS.tmpl;
  let rows = [];
  try { rows = await DB.all('cardimg'); } catch (e) { console.warn(e); }
  VIS.tmpl = new Map(rows.map(r => [r.no, r.imgs.map(px => visVec(px))]));
  VIS.tmplRaw = new Map(rows.map(r => [r.no, r]));
  return VIS.tmpl;
}
async function visSaveTemplates(list) {
  await visLoadTemplates();
  for (const { no, px } of list) {
    const r = VIS.tmplRaw.get(no) || { no, imgs: [] };
    r.imgs = [...r.imgs, Array.from(px, v => Math.round(v))].slice(-4);
    VIS.tmplRaw.set(no, r);
    VIS.tmpl.set(no, r.imgs.map(p => visVec(p)));
    try { await DB.put('cardimg', r); } catch (e) { console.warn(e); }
  }
}

// --- 文字認識(Tesseract、縦書き日本語)
function visLoadTess(onStatus) {
  if (VIS.tessReady) return VIS.tessReady;
  VIS.tessReady = (async () => {
    if (!window.Tesseract) {
      onStatus?.('文字認識の準備をしています…(初回は数MBの読み込み)');
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = res; s.onerror = () => rej(new Error('文字認識の部品を読み込めませんでした'));
        document.head.appendChild(s);
      });
    }
    const w = await Tesseract.createWorker('jpn_vert');
    await w.setParameters({ tessedit_pageseg_mode: '5' }); // 縦書きのひとかたまり
    VIS.tess = w;
    return w;
  })();
  VIS.tessReady.catch(() => { VIS.tessReady = null; });
  return VIS.tessReady;
}
const VIS_SHIMO = () => VIS.shimo || (VIS.shimo = ALL_CARDS.map(no => [no, phNorm(POEMS[no].shimoKana.replace(/\s/g, ''))]));
function visOcrScores(text) {
  const q = phNorm(String(text || '').replace(/[^ぁ-ゖァ-ヶー]/g, ''));
  if (q.length < 3) return new Map();
  return new Map(VIS_SHIMO().map(([no, y]) => [no, phAlign(q, y) / (2 * y.length)]));
}

// --- まとめて読み取る
async function visRecognize(src, boxes, onProg, cancelled) {
  const tm = await visLoadTemplates();
  const live = boxes.filter(b => !b.off);
  let k = 0;
  for (const b of live) {
    if (cancelled()) return false;
    const small = visCrop(src, b, TH);
    b.px = visGray(small);
    const v = visVec(b.px);
    b.tscore = new Map();
    tm.forEach((vs, no) => b.tscore.set(no, Math.max(...vs.map(t => visDot(v, t)))));
    const tb = [...b.tscore.entries()].sort((a, c) => c[1] - a[1]);
    const sure = tb[0] && tb[0][1] > 0.8 && (!tb[1] || tb[0][1] - tb[1][1] > 0.12);
    b.oscore = new Map();
    if (!sure) {
      const w = await visLoadTess(t => onProg(t));
      if (cancelled()) return false;
      // 2通りの切り出し方で読み、良いほうの点を使う(1回目で十分なら2回目は省く)
      b.ocr = [];
      for (const variant of [1, 2]) {
        const r = await w.recognize(visCropOCR(src, b, variant));
        b.ocr.push(r.data.text);
        visOcrScores(r.data.text).forEach((v, no) => b.oscore.set(no, Math.max(b.oscore.get(no) || 0, v)));
        const best = Math.max(0, ...b.oscore.values());
        if (best >= 0.4 || cancelled()) break;
      }
    }
    onProg(`札を読み取っています… ${++k} / ${live.length}`, k / live.length);
  }
  visSolve(boxes);
  return true;
}
// 見本・文字認識の点を合わせて、同じ札が重ならないように割り当てる
function visSolve(boxes) {
  const live = boxes.filter(b => !b.off && b.tscore);
  const all = [];
  for (const b of live) {
    const sc = new Map();
    for (const no of ALL_CARDS) {
      const o = b.oscore?.get(no) ?? 0, t = b.tscore?.get(no) ?? 0;
      const oP = clamp((o - 0.12) / 0.33, 0, 1), tP = clamp((t - 0.5) / 0.35, 0, 1);
      const s = Math.max(oP, tP) + 0.2 * Math.min(oP, tP);
      if (s > 0.05) sc.set(no, +s.toFixed(3));
    }
    b.cands = [...sc.entries()].sort((a, c) => c[1] - a[1]).slice(0, 5);
    if (b.manual) continue;
    b.cands.forEach(([no, s]) => all.push([s, b, no]));
    b.no = null; b.conf = 'none';
  }
  const used = new Set(live.filter(b => b.manual && b.no != null).map(b => b.no));
  all.sort((a, c) => c[0] - a[0]);
  for (const [s, b, no] of all) {
    if (b.no != null || used.has(no) || s < 0.3) continue;
    b.no = no; used.add(no);
    const second = b.cands.find(([n]) => n !== no)?.[1] ?? 0;
    b.conf = s >= 0.6 && s - second >= 0.2 ? 'ok' : 'unsure';
  }
}

// ===== 画面 =====
async function openVision(mode) {
  const m = curMatch();
  let src = document.createElement('canvas');
  if (mode === 'video') {
    const v = vid();
    if (!v || !v.currentSrc) { alert('このページでは、まだ動画ファイルが選ばれていません。\n(ページを開き直すたびに、動画の上の「動画を選ぶ」で同じ動画を選び直す必要があります。音声の解析結果や読みの一覧は保存されています)'); return; }
    // 映像の1コマが準備できるまで少し待つ
    if (v.readyState < 2) await new Promise(res => { const t = setTimeout(res, 4000); v.addEventListener('loadeddata', () => { clearTimeout(t); res(); }, { once: true }); });
    if (!v.videoWidth) { alert('動画ファイルは開けていますが、このブラウザでは映像を表示できないようです(音声だけ再生されている状態)。\nChromeで開くか、「写真から読み取る」で盤面の写真やスクリーンショットを使ってください。'); return; }
    v.pause();
    src.width = v.videoWidth; src.height = v.videoHeight;
    src.getContext('2d').drawImage(v, 0, 0);
  } else {
    const file = await new Promise(res => {
      const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
      i.onchange = () => res(i.files[0]); i.click();
    });
    if (!file) return;
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { alert('この画像は読み込めませんでした。iPhoneの写真(HEIC)の場合は、JPEGで書き出すか、「設定→カメラ→フォーマット→互換性優先」で撮影してください。'); return; }
    const sc = Math.min(1, 3200 / Math.max(bmp.width, bmp.height));
    src.width = Math.round(bmp.width * sc); src.height = Math.round(bmp.height * sc);
    src.getContext('2d').drawImage(bmp, 0, 0, src.width, src.height);
  }
  const S = { src, boxes: [], seamX: 0, midY: 0, stage: 'detect', busy: false, cancel: false };
  const bg = document.createElement('div');
  bg.className = 'modal-bg vis-bg';
  bg.innerHTML = `<div class="modal vis-modal">
    <div class="mh"><b>${mode === 'video' ? '動画から配置を読み取る' : '写真から配置を読み取る'}</b><span class="spacer"></span>
      ${mode === 'photo' ? '<button data-v="rot">90°回転</button>' : ''}
      <button data-v="redetect">札を探し直す</button>
      <button data-v="run" class="primary">読み取り開始</button>
      <button data-v="apply" class="primary" disabled>配置に反映</button>
      <button data-v="close">閉じる</button></div>
    <div class="mb">
      <div class="vis-help small muted"></div>
      <div class="vis-wrap"><canvas class="vis-cv"></canvas></div>
      <div class="vis-status small"></div>
    </div></div>`;
  document.body.appendChild(bg);
  const cv = bg.querySelector('.vis-cv'), g = cv.getContext('2d');
  const help = bg.querySelector('.vis-help'), status = bg.querySelector('.vis-status');
  const btn = v => bg.querySelector(`button[data-v="${v}"]`);
  let scale = 1;
  const vstat = (t, p) => { status.innerHTML = esc(t) + (p != null ? ` <span class="vis-bar"><i style="width:${Math.round(p * 100)}%"></i></span>` : ''); };
  const detect = () => {
    const sc = Math.min(1, 1600 / Math.max(src.width, src.height));
    const t = document.createElement('canvas');
    t.width = Math.round(src.width * sc); t.height = Math.round(src.height * sc);
    t.getContext('2d').drawImage(src, 0, 0, t.width, t.height);
    const bx = visDetect(t.getContext('2d').getImageData(0, 0, t.width, t.height));
    S.boxes = bx.map(b => ({ x: b.x / sc, y: b.y / sc, w: b.w / sc, h: b.h / sc }));
    S.seamX = visGap(S.boxes, 0) ?? src.width / 2;
    S.midY = visGap(S.boxes, 1) ?? src.height / 2;
    S.stage = 'detect';
    visAssignSlots(S.boxes, S.seamX, S.midY);
    btn('apply').disabled = true;
    const c = countSides(Object.fromEntries(S.boxes.filter(b => b.slot).map(b => [b.slot, 1])));
    vstat(`札を${S.boxes.length}枚見つけました(左 ${c.N}枚・右 ${c.F}枚)。`);
    draw();
  };
  const fit = () => {
    const maxW = Math.min(window.innerWidth * 0.94 - 40, 1400), maxH = window.innerHeight * 0.66;
    scale = Math.min(maxW / src.width, maxH / src.height);
    cv.width = Math.round(src.width * scale); cv.height = Math.round(src.height * scale);
  };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const draw = () => {
    fit();
    g.drawImage(src, 0, 0, cv.width, cv.height);
    help.innerHTML = S.stage === 'detect'
      ? (mode === 'photo' ? '<b>左の選手が画面の左、右の選手が画面の右</b>になるように「90°回転」で向きを合わせてください。' : '') + '青=左の選手・橙=右の選手の札。<b>枠をクリック</b>で除外/戻す、<b>何もない所をドラッグ</b>で札の枠を追加、<b>点線</b>(中央線・上下の境目)はドラッグで動かせます。よければ「読み取り開始」(1枚1〜2秒かかります)。'
      : '<b style="color:var(--good)">緑</b>=自信あり <b style="color:var(--warn)">黄</b>=要確認 <b style="color:var(--bad)">赤</b>=読めず。<b>枠をクリック</b>で札を選び直せます。直し終わったら「配置に反映」。';
    g.save(); g.setLineDash([6, 5]); g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,.9)';
    g.beginPath(); g.moveTo(S.seamX * scale, 0); g.lineTo(S.seamX * scale, cv.height); g.stroke();
    g.beginPath(); g.moveTo(0, S.midY * scale); g.lineTo(cv.width, S.midY * scale); g.stroke();
    g.restore();
    for (const b of S.boxes) {
      const x = b.x * scale, y = b.y * scale, w = b.w * scale, h = b.h * scale;
      g.lineWidth = 2;
      if (b.off) { g.strokeStyle = 'rgba(120,120,120,.9)'; g.setLineDash([3, 3]); g.strokeRect(x, y, w, h); g.setLineDash([]); continue; }
      g.strokeStyle = b.side === 'F' ? css('--far') : css('--near');
      g.strokeRect(x, y, w, h);
      if (S.stage === 'result') {
        const col = b.conf === 'ok' ? '31,138,76' : b.conf === 'unsure' ? '184,134,11' : '192,57,43';
        g.fillStyle = `rgba(${col},${b.manual ? 0.35 : 0.55})`; g.fillRect(x, y, w, h);
        g.fillStyle = '#fff'; g.font = `bold ${Math.max(10, Math.min(16, h * 0.5))}px sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(b.no != null ? STD_KIMARI[b.no] : '?', x + w / 2, y + h / 2);
      }
    }
  };
  // --- 操作
  let drag = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; };
  const hit = p => S.boxes.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
  cv.addEventListener('pointerdown', e => {
    if (S.busy) return;
    const p = pos(e), tol = 7 / scale;
    if (Math.abs(p.x - S.seamX) < tol) drag = { kind: 'seam' };
    else if (Math.abs(p.y - S.midY) < tol) drag = { kind: 'mid' };
    else drag = { kind: 'new', p0: p, p };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    const p = pos(e);
    if (!drag) { const tol = 7 / scale; cv.style.cursor = Math.abs(p.x - S.seamX) < tol ? 'ew-resize' : Math.abs(p.y - S.midY) < tol ? 'ns-resize' : hit(p) ? 'pointer' : 'crosshair'; return; }
    if (drag.kind === 'seam') S.seamX = p.x;
    else if (drag.kind === 'mid') S.midY = p.y;
    else drag.p = p;
    draw();
    if (drag.kind === 'new') { const a = drag.p0; g.strokeStyle = '#fff'; g.setLineDash([4, 3]); g.strokeRect(Math.min(a.x, p.x) * scale, Math.min(a.y, p.y) * scale, Math.abs(p.x - a.x) * scale, Math.abs(p.y - a.y) * scale); g.setLineDash([]); }
  });
  cv.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.kind === 'seam' || d.kind === 'mid') { visAssignSlots(S.boxes, S.seamX, S.midY); draw(); return; }
    const p = pos(e), a = d.p0;
    const moved = Math.hypot((p.x - a.x) * scale, (p.y - a.y) * scale) > 8;
    if (moved) {
      S.boxes.push({ x: Math.min(a.x, p.x), y: Math.min(a.y, p.y), w: Math.abs(p.x - a.x), h: Math.abs(p.y - a.y), added: true });
      visAssignSlots(S.boxes, S.seamX, S.midY);
      if (S.stage === 'result') { const b = S.boxes[S.boxes.length - 1]; b.tscore = new Map(); b.oscore = new Map(); b.no = null; b.conf = 'none'; b.cands = []; }
      draw(); return;
    }
    const b = hit(p);
    if (!b) return;
    if (S.stage === 'detect') { b.off = !b.off; visAssignSlots(S.boxes, S.seamX, S.midY); draw(); return; }
    if (b.off) { b.off = false; visAssignSlots(S.boxes, S.seamX, S.midY); draw(); return; }
    const used = new Set(S.boxes.filter(x => x !== b && !x.off && x.no != null).map(x => x.no));
    openPicker({
      title: `${SIDE_NAME[b.side]}の選手 ${ROW_NAMES[b.row]} の札`, used, cands: b.cands || [], candLabel: '読み取りの候補', allowNone: true, noneLabel: 'この枠を除外',
      onPick: c => {
        if (c == null) { b.off = true; b.no = null; }
        else {
          const other = S.boxes.find(x => x !== b && x.no === c);
          if (other) { other.no = null; other.conf = 'none'; other.manual = false; }
          b.no = c; b.manual = true; b.conf = 'ok';
        }
        visAssignSlots(S.boxes, S.seamX, S.midY); draw(); summary();
      }
    });
  });
  const summary = () => {
    const live = S.boxes.filter(b => !b.off);
    const ok = live.filter(b => b.no != null && b.conf === 'ok').length, un = live.filter(b => b.no != null && b.conf === 'unsure').length, no = live.filter(b => b.no == null).length;
    vstat(`${live.length}枚:自信あり ${ok}枚・要確認 ${un}枚・読めず ${no}枚。黄と赤の枠をクリックして直してください。`);
  };
  bg.addEventListener('click', async e => {
    const b = e.target.closest('button[data-v]');
    if (!b || b.disabled) return;
    const v = b.dataset.v;
    if (v === 'close') { if (S.busy) { S.cancel = true; return; } bg.remove(); return; }
    if (S.busy) return;
    if (v === 'rot') {
      const r = document.createElement('canvas'); r.width = src.height; r.height = src.width;
      const rg = r.getContext('2d'); rg.translate(r.width, 0); rg.rotate(Math.PI / 2); rg.drawImage(src, 0, 0);
      src = S.src = r; detect(); return;
    }
    if (v === 'redetect') { detect(); return; }
    if (v === 'run') {
      if (!S.boxes.some(x => !x.off)) return;
      S.busy = true; S.cancel = false; btn('close').textContent = '中止';
      $$('button', bg).forEach(x => { if (x.dataset.v !== 'close') x.disabled = true; });
      try {
        const done = await visRecognize(src, S.boxes, (t, p) => vstat(t, p), () => S.cancel);
        if (done) { S.stage = 'result'; draw(); summary(); btn('apply').disabled = false; }
        else vstat('中止しました。');
      } catch (err) { console.error(err); vstat('読み取りに失敗しました:' + err.message); }
      finally {
        S.busy = false; btn('close').textContent = '閉じる';
        $$('button', bg).forEach(x => { if (x.dataset.v !== 'apply') x.disabled = false; });
        if (S.stage === 'result') btn('apply').disabled = false;
      }
      return;
    }
    if (v === 'apply') {
      const live = S.boxes.filter(x => !x.off && x.no != null && x.slot);
      if (Object.keys(m.layout || {}).length && !confirm('今の初期配置を、読み取った配置で置き換えますか?')) return;
      m.layout = {};
      live.forEach(x => { m.layout[x.slot] = x.no; });
      saveMatch(m, true); refreshRP(); drawBoard(); drawEditor(); drawReads();
      // 次回のための見本として保存(自信あり・手で選んだ札)
      const learn = live.filter(x => x.px && (x.manual || x.conf === 'ok')).map(x => ({ no: x.no, px: x.px }));
      visSaveTemplates(learn);
      const miss = S.boxes.filter(x => !x.off && x.no == null).length;
      bg.remove();
      setStatus(`配置に${live.length}枚を反映しました${miss ? `(読めなかった${miss}枚は盤面で入力してください)` : ''}。`);
    }
  });
  window.addEventListener('resize', draw, { once: true });
  detect();
}

function toast(msg, ms = 2400) {

const tipEl = () => $('#tip') || Object.assign(document.body.appendChild(document.createElement('div')), { id: 'tip', className: 'tip' });

function hideTip() { const t = $('#tip'); if (t) t.style.display = 'none'; }

// ===== 画面切り替え =====
function go(view, extra = {}) {
  if (view !== 'match') stopVideo();
  Object.assign(App, { view }, extra);
  render();
}
function render() {
  $$('header.app nav button').forEach(b => b.classList.toggle('on', b.dataset.go === App.view || (App.view === 'match' && b.dataset.go === 'home')));
  const main = $('main');
  if (App.view === 'home') main.innerHTML = homeHTML();
  else if (App.view === 'players') main.innerHTML = playersHTML();
  else if (App.view === 'match') { renderMatch(); return; }
  bindCommon(main);
}
function bindCommon(root) {
  root.querySelectorAll('[data-act]').forEach(el => {
    const ev = el.tagName === 'SELECT' || el.type === 'range' || el.type === 'checkbox' || el.type === 'number' || el.type === 'file' ? 'change' : 'click';
    el.addEventListener(ev, e => { e.stopPropagation(); ACT[el.dataset.act]?.(el, e); });
  });
}

// 選手ごとの全試合集計
function playerAgg(pid) {
  const A = { n: 0, win: 0, lose: 0, take: { ownL: 0, ownR: 0, enemyL: 0, enemyR: 0 }, lost: { ownL: 0, ownR: 0, enemyL: 0, enemyR: 0 }, total: 0,
    faults: 0, sent: {}, react: [], perMatch: [], weakCards: {}, strongCards: {}, diff: [] };
  const ms = App.matches.filter(m => m.players?.N === pid || m.players?.F === pid).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  for (const m of ms) {
    const side = m.players.N === pid ? 'N' : 'F';
    const { S, rp } = matchStats(m);
    const me = S[side], op = S[opp(side)];
    A.n++;
    if (rp.winner === side) { A.win++; A.diff.push(rp.count[opp(side)]); }
    else if (rp.winner) { A.lose++; A.diff.push(-rp.count[side]); }
    for (const k in me.take) { A.take[k] += me.take[k]; }
    // 相手に取られた札を自分視点のエリアに換算(相手の敵陣=自分の自陣、左右反転)
    const flip = { ownL: 'enemyR', ownR: 'enemyL', enemyL: 'ownR', enemyR: 'ownL' };
    for (const k in op.take) A.lost[flip[k]] += op.take[k];
    A.total += me.total;
    A.faults += me.faults.空札 + me.faults.出札;
    me.sent.forEach(s => { A.sent[s.card] = (A.sent[s.card] || 0) + 1; });
    me.react.forEach(r => A.react.push({ ...r, date: m.date }));
    const mv = me.react.map(r => r.move).filter(x => x != null);
    A.perMatch.push({ date: m.date, title: m.title, id: m.id, move: mean(mv), n: mv.length, side, won: rp.winner === side });
    rp.steps.forEach(st => {
      if (!st.take || !st.onField) return;
      if (st.fieldSide === side) {
        if (st.take.side !== side) A.weakCards[st.read.card] = (A.weakCards[st.read.card] || 0) + 1;
      } else if (st.take.side === side) A.strongCards[st.read.card] = (A.strongCards[st.read.card] || 0) + 1;
    });
  }
  return A;
}
function topCards(obj, n = 8) {
  return Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n).map(([c, k]) => `<span class="chip" data-tip="${esc(POEMS[c].kami)} / ${esc(POEMS[c].author)}">${STD_KIMARI[c]} ×${k}</span>`).join('') || '<span class="muted small">—</span>';
}

// ===== グラフ(SVG) =====
// series: [{name, color, pts:[{x,y,tip}]}]
function lineChart(series, o = {}) {
  const W = o.w || 560, H = o.h || 200, pl = 44, pr = 14, pt = 12, pb = 26;
  const all = series.flatMap(s => s.pts);
  if (!all.length) return '<div class="muted small">データがありません</div>';
  const xmin = o.xmin ?? Math.min(...all.map(p => p.x)), xmax = o.xmax ?? Math.max(...all.map(p => p.x), xmin + 1);
  let ymin = o.ymin ?? Math.min(...all.map(p => p.y)), ymax = o.ymax ?? Math.max(...all.map(p => p.y));
  if (ymin === ymax) { ymin -= 1; ymax += 1; }
  const X = x => pl + (x - xmin) / (xmax - xmin || 1) * (W - pl - pr);
  const Y = y => pt + (1 - (y - ymin) / (ymax - ymin)) * (H - pt - pb);
  const ticks = o.yTicks || niceTicks(ymin, ymax, 4);
  let g = ticks.map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${o.yFmt ? o.yFmt(v) : v}</text>`).join('');
  if (o.refY != null) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(o.refY)}" y2="${Y(o.refY)}" stroke="var(--line-2)" stroke-dasharray="4 3"/>`;
  if (o.xLabels) {
    const step = Math.ceil(o.xLabels.length / 10);
    g += o.xLabels.map((l, i) => i % step === 0 ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>` : '').join('');
  } else {
    niceTicks(xmin, xmax, 8).forEach(v => { g += `<text x="${X(v)}" y="${H - 8}" text-anchor="middle">${o.xFmt ? o.xFmt(v) : v}</text>`; });
  }
  const lines = series.map(s => {
    const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
    const pts = s.pts.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${o.dots === false ? 0 : 3.5}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="9" fill="transparent" data-tip="${esc(p.tip || '')}"/>`).join('');
    return `${o.noLine ? '' : `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`}${pts}`;
  }).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `${legend}<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>${g}${lines}${o.yLabel ? `<text x="4" y="10">${esc(o.yLabel)}</text>` : ''}</svg>`;
}
function niceTicks(a, b, n) {
  const span = b - a, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const step = [1, 2, 5, 10].map(k => k * mag).find(s => span / s <= n) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(a / step) * step; v <= b + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

// ===== 札を選ぶダイアログ =====
function openPicker({ title, used = new Set(), cands = [], allowJo = false, allowNone = false, candLabel = '音声認識の候補', noneLabel = '未確定にする', onPick }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const candSet = new Set(cands.map(c => c[0]));
  bg.innerHTML = `<div class="modal">
    <div class="mh"><b>${esc(title)}</b><input type="search" id="pk-q" placeholder="決まり字・かな・作者・番号で検索" style="flex:1" autofocus>
      ${allowJo ? '<button data-v="0">序歌</button>' : ''}${allowNone ? `<button data-v="null">${esc(noneLabel)}</button>` : ''}<button data-v="close">閉じる</button></div>
    <div class="mb">
      ${cands.length ? `<div style="margin-bottom:10px"><div class="muted small" style="margin-bottom:4px">${esc(candLabel)}</div><div class="cand">${cands.slice(0, 5).map(([n, s]) => `<button data-v="${n}" class="${n === 0 ? '' : ''}">${n === 0 ? '序歌' : STD_KIMARI[n]} <span class="muted small">${Math.round(s * 100)}%</span></button>`).join('')}</div></div>` : ''}
      <div class="picker-grid"></div>
    </div></div>`;
  document.body.appendChild(bg);
  const grid = bg.querySelector('.picker-grid');
  const draw = q => {
    const nq = normJa(q);
    const list = ALL_CARDS.filter(n => {
      if (!q) return true;
      const p = POEMS[n];
      return String(n) === q.trim() || p.kanaFlat.startsWith(nq) || p.yomiFlat.startsWith(nq) || p.kami.includes(q) || p.author.includes(q) || normJa(p.kamiKana).includes(nq) || normJa(p.shimoKana).includes(nq);
    });
    // 一字決まり→六字の順(競技の覚え方に合わせる)
    const pre = n => (q && (POEMS[n].kanaFlat.startsWith(nq) || POEMS[n].yomiFlat.startsWith(nq) || String(n) === q.trim()) ? 0 : 1);
    list.sort((a, b) => pre(a) - pre(b) || STD_KIMARI[a].length - STD_KIMARI[b].length || POEMS[a].yomiFlat.localeCompare(POEMS[b].yomiFlat, 'ja'));
    grid.innerHTML = list.map(n => `<button data-v="${n}" class="${used.has(n) ? 'used' : ''} ${candSet.has(n) ? 'cand-hit' : ''}" title="${esc(POEMS[n].kami)}\n${esc(POEMS[n].shimo)}"><b>${STD_KIMARI[n]}</b><span>${esc(POEMS[n].shimoKana.slice(0, 9))}</span><span>${n}. ${esc(POEMS[n].author)}</span></button>`).join('');
  };
  draw('');
  const q = bg.querySelector('#pk-q');
  q.addEventListener('input', () => draw(q.value));
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const b = grid.querySelector('button:not(.used)') || grid.querySelector('button'); b?.click(); }
    if (e.key === 'Escape') close();
  });
  const close = () => bg.remove();
  bg.addEventListener('click', e => {
    if (e.target === bg) return close();
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    const v = b.dataset.v;
    if (v === 'close') return close();
    close();
    onPick(v === 'null' ? null : +v);
  });
  setTimeout(() => q.focus(), 30);
}

ACT.exportAll = () => {
  const blob = new Blob([JSON.stringify({ app: 'karuta-video-app', version: 1, exported: new Date().toISOString(), players: App.players, matches: App.matches }, null, 1)], { type: 'application/json' });
  downloadBlob(blob, `karuta-data-${new Date().toISOString().slice(0, 10)}.json`);
};
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 300000);
}
async function importFile(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.players) || !Array.isArray(d.matches)) throw new Error('形式が違います');
    if (!confirm(`選手 ${d.players.length}人、試合 ${d.matches.length}件を読み込みます。同じIDのデータは上書きされます。よろしいですか?`)) return;
    for (const p of d.players) { await DB.put('players', p); }
    for (const m of d.matches) { await DB.put('matches', m); }
    App.players = await DB.all('players'); App.matches = await DB.all('matches');
    toast('読み込みました'); render();
  } catch (e) { alert('読み込みに失敗しました: ' + e.message); }
}

function tick() {

let lastTLDraw = 0;

  if (b) {
    const m = curMatch();
    const i = (m.reads || []).findLastIndex(r => r.t != null && r.t <= v.currentTime + 0.05);

ACT.play = () => { const v = vid(); if (!v) return; v.paused ? v.play() : v.pause(); };

// ===== 盤面 =====
function boardView() {

}
function drawBoard() {

  };
  // 横から撮影した向き:左の選手の陣が画面左、右の選手の陣が画面右

  const screenCols = [['N', 2], ['N', 1], ['N', 0], null, ['F', 0], ['F', 1], ['F', 2]];

  $('#board').innerHTML = `<div class="board">
    <div class="board-head">${who('N')}<div class="midline">${title}</div>${who('F')}</div>
    <div class="terr-h">${grid}</div>
    <div class="board-foot"><span>下段 中段 上段</span><span class="muted">${App.pick != null ? `「${STD_KIMARI[App.pick]}」を選択中:移動先をクリック` : '左右は各選手から見た向き(左の選手は画面上側が左手側)'}</span><span>上段 中段 下段</span></div>
  </div>`;
}
function onBoardClick(e) {
  const m = curMatch(), V = boardView();
  const f = e.target.closest('.fuda:not(.ghost)');
  const s = e.target.closest('.slot.empty');
  if (f) {
    const c = +f.dataset.card;
    App.pick = App.pick === c ? null : c;
    drawBoard(); drawEditor(); return;
  }
  if (!s) return;
  const k = s.dataset.slot;
  if (App.pick != null) {
    const c = App.pick; App.pick = null;
    if (V.mode === 'layout') {
      const from = invertBoard(m.layout)[c];
      if (from) delete m.layout[from];
      m.layout[k] = c;
    } else {
      const r = m.reads[App.sel];
      r.ops = r.ops || [];
      r.ops.push({ card: c, to: k }); delete r.autoTake;
    }
    saveMatch(m); refreshRP(); drawBoard(); drawEditor(); drawReads();
    return;
  }
  if (V.mode === 'layout') {
    const used = new Set(Object.values(m.layout));
    openPicker({ title: `${SIDE_NAME[k[0]]}陣 ${ROW_NAMES[parseSlot(k).row]} に置く札`, used, onPick: c => {
      if (c == null || c === 0) return;

function drawTimelines() {
  const m = curMatch(), v = vid();
  const dur = v?.duration || m.video?.duration || 0;
  const cv = $('#tl-all'), cz = $('#tl-zoom');
  if (!cv) return;
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  const setup = c => { const w = c.clientWidth, h = +c.getAttribute('height'), dpr = devicePixelRatio || 1; c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px'; const g = c.getContext('2d'); g.scale(dpr, dpr); return [g, w, h]; };
  const cur = v?.currentTime || 0;
  const cuts = computeCuts(m);
  // 全体
  {
    const [g, w, h] = setup(cv);
    g.clearRect(0, 0, w, h);
    if (dur) {
      const X = t => t / dur * w;
      g.fillStyle = col('--line');
      (m.audio?.units || []).forEach(u => g.fillRect(X(u.s), 14, Math.max(1, X(u.e) - X(u.s)), 18));
      g.fillStyle = col('--good');
      cuts.forEach(c => g.fillRect(X(c[0]), h - 5, Math.max(1, X(c[1]) - X(c[0])), 4));
      m.reads.forEach((r, i) => {
        if (r.t == null) return;
        const st = RP.steps[i];
        g.fillStyle = r.card == null ? col('--warn') : st?.take ? col(st.take.side === 'N' ? '--near' : '--far') : r.card === 0 ? col('--accent') : col('--muted');
        g.fillRect(X(r.t) - 1, i === App.sel ? 2 : 8, i === App.sel ? 3 : 2, i === App.sel ? 34 : 28);
      });
      g.fillStyle = col('--text'); g.fillRect(X(cur) - 1, 0, 2, h);
      $('#tl-info').textContent = `${fmtT(cur)} / ${fmtT(dur)}`;
    } else { g.fillStyle = col('--muted'); g.font = '12px sans-serif'; g.fillText('動画を開くと表示されます', 8, 28); }
  }
  // 拡大
  {
    const [g, w, h] = setup(cz);
    g.clearRect(0, 0, w, h);
    if (!dur) return;
    const a = cur - 8, b = cur + 8, X = t => (t - a) / (b - a) * w;
    // 音量
    if (App.energy) {
      g.fillStyle = col('--line-2');
      const hop = 0.02, e = App.energy, lo = App.energyRange[0], hi = App.energyRange[1];
      for (let t = Math.max(0, a); t < b; t += hop) {
        const i = Math.floor(t / hop); if (i >= e.length) break;
        const y = clamp((e[i] - lo) / (hi - lo), 0, 1) * (h - 20);
        g.fillRect(X(t), h - 12 - y, Math.max(1, w / 800), y);
      }
    }
    g.fillStyle = col('--accent-soft');
    (m.audio?.segs || []).forEach(s => { if (s[1] > a && s[0] < b) g.fillRect(X(s[0]), h - 12, X(s[1]) - X(s[0]), 4); });
    g.fillStyle = col('--good');
    cuts.forEach(c => { if (c[1] > a && c[0] < b) g.fillRect(X(c[0]), h - 5, X(c[1]) - X(c[0]), 4); });
    g.font = 'bold 11px sans-serif';
    m.reads.forEach((r, i) => {
      if (r.t == null || r.t < a - 6 || r.t > b) return;
      const st = RP.steps[i];
      g.fillStyle = i === App.sel ? col('--accent') : col('--text-2');
      g.fillRect(X(r.t) - 1, 0, 2, h - 12);
      g.fillText(`${r.card === 0 ? '序歌' : r.card ? STD_KIMARI[r.card] : '?'}`, X(r.t) + 3, 11);
      const kt = kimariTime(r, st);
      if (kt.t != null) { g.setLineDash([3, 3]); g.strokeStyle = g.fillStyle; g.beginPath(); g.moveTo(X(kt.t), 14); g.lineTo(X(kt.t), h - 12); g.stroke(); g.setLineDash([]); }
      for (const s of ['N', 'F']) {
        const rc = r.react?.[s]; if (!rc) continue;
        g.fillStyle = col(s === 'N' ? '--near' : '--far');
        const y = s === 'N' ? h - 22 : h - 34;
        if (rc.move != null) { g.beginPath(); g.moveTo(X(rc.move), y - 6); g.lineTo(X(rc.move) - 5, y + 3); g.lineTo(X(rc.move) + 5, y + 3); g.fill(); }
        if (rc.touch != null) { g.beginPath(); g.arc(X(rc.touch), y, 4, 0, 7); g.fill(); }
      }
    });
    g.fillStyle = col('--text'); g.fillRect(w / 2 - 1, 0, 2, h);
    g.fillStyle = col('--muted'); g.font = '10px sans-serif';
    for (let t = Math.ceil(a); t <= b; t++) if (t >= 0 && t % 2 === 0) g.fillText(fmtT(t).replace(/\.\d$/, ''), X(t) + 2, h - 1 - 6);
  }
}

document.addEventListener('keydown', e => {
  if (App.view !== 'match' || App.tab !== 'edit') return;
  if (e.target.closest('input, textarea, select') || $('.modal-bg')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const m = curMatch(), k = e.key;
  const fps = m.fps || 30;
  const v = vid();
  const handled = () => e.preventDefault();
  if (k === ' ') { handled(); ACT.play(); }
  else if (k === 'ArrowLeft' || k === 'ArrowRight') {
    handled(); if (!v) return;
    const d = (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 1 / fps);
    if (!e.shiftKey) v.pause();
    seekTo(v.currentTime + d);
  }
  else if (k === 'ArrowUp' || k === 'ArrowDown') { handled(); if (!m.reads.length) return; selectRead(clamp(App.sel + (k === 'ArrowUp' ? -1 : 1), 0, m.reads.length - 1)); }
  else if (k === 'r' || k === 'R') { handled(); ACT.addRead(); }
  else if ((k === 'k' || k === 'K') && App.sel >= 0) { handled(); ACT.setK(); }
  else if (['1', '2', '9', '0'].includes(k) && App.sel >= 0) {
    handled();
    const side = k === '1' || k === '2' ? 'N' : 'F', key = k === '1' || k === '9' ? 'move' : 'touch';
    ACT.markReact({ dataset: { side, k: key } });
  }
  else if (k === 'Escape') { App.pick = null; drawBoard(); drawEditor(); }
  else if ((k === 'Delete' || k === 'Backspace') && App.sel < 0 && App.pick != null) { handled(); ACT.removePick(); }
});

window.addEventListener('beforeunload', e => { if (App.asrRunning) { e.preventDefault(); e.returnValue = ''; } });
ACT.runASR = async () => {
  const m = curMatch();
  if (!App.videoFile) return toast('先に動画を開いてください');
  if (!m.audio?.units) return toast('先に①を実行してください');
  const model = $('#au-model').value;
  App.asrCancel = false; App.asrRunning = true;
  $('#au-cancel').style.display = '';
  const units = m.audio.units;
  const done = m.audio.asrDoneUnits = (m.audio.asrDoneUnits || []).slice(0, units.length);
  if (!done.some(Boolean)) m.audio.asrChunks = [];
  m.audio.asrChunks = m.audio.asrChunks || [];
  units.forEach(u => delete u._chunks);
  try {
    const A = await decodeVideoAudio(App.videoFile, (t, p) => setStatus(t, p));
    await loadASR(model, t => setStatus(t, 0));
    m.audio.model = model;
    // 未処理のまとまりを、約29秒ずつの束にまとめる
    const todo = units.map((u, i) => i).filter(i => !done[i]);
    const batches = [];
    let cur = null;
    for (const ui of todo) {
      const u = units[ui];
      const parts = [];
      for (let s = u.s; s < u.e; s += 26) parts.push([s, Math.min(u.e, s + 26)]);
      for (const p of parts) {
        const len = p[1] - p[0] + 1.4;
        if (!cur || cur.len + len > 29) { cur = { pieces: [], units: new Set(), len: 0 }; batches.push(cur); }
        cur.pieces.push(p); cur.units.add(ui); cur.len += len;
      }
    }
    const t0 = performance.now();
    const doneBefore = units.length - todo.length;
    for (let bi = 0; bi < batches.length; bi++) {
      if (App.asrCancel) break;
      const eta = bi ? ((performance.now() - t0) / bi * (batches.length - bi) / 1000) : null;
      const finished = doneBefore + batches.slice(0, bi).reduce((a, x) => a + x.units.size, 0);
      setStatus(`音声認識中… ${Math.min(units.length, finished)} / ${units.length}か所 完了${eta ? `(残り約${Math.ceil(eta / 60)}分)` : ''} [${ASR.device === 'webgpu' ? 'GPU' : 'CPU'}]`, finished / units.length);
      const B = batches[bi];
      const chunks = await transcribePacked(A.data, A.sr, B.pieces);
      chunks.forEach(c => { if (c.text && c.text.trim()) m.audio.asrChunks.push({ s: +c.s.toFixed(2), e: +c.e.toFixed(2), text: c.text.trim() }); });
      // 束の最後のまとまりは、次の束に続いている場合があるので、全部そろってから反映
      for (const ui of B.units) {
        const u = units[ui];
        const cs = chunks.filter(c => c.s >= u.s - 0.6 && c.s <= u.e + 0.3);
        (u._chunks = u._chunks || []).push(...cs);
        const last = B.pieces[B.pieces.length - 1];
        const unitEnds = u.e <= last[1] + 0.01;
        if (unitEnds) {
          applyASRUnit(m, u, u._chunks.map(c => c.text).join(''), u._chunks);
          delete u._chunks;
          done[ui] = true;
        }
      }
      saveMatch(m, true); // 1束ごとに保存(途中で閉じても続きから再開できる)
      refreshRP(); drawReads(); drawTimelines();
    }
    units.forEach(u => delete u._chunks);
    const nDone = done.filter(Boolean).length;
    if (!App.asrCancel && nDone >= units.length) {
      m.audio.asrDone = true;
      try {
        const r = await rejudgeReads(m, t => setStatus(t, 1));
        setStatus(`音声認識と照合が終わりました。${r.assigned}件の札を特定しました(下の句だけの行${r.removed}件・読み以外の音の行${r.noise}件を整理)。黄色の行を確認してください。`, 1);
      } catch (e) { console.warn(e); setStatus(`音声認識が終わりました(${units.length}か所)。※読みの照合は失敗しました:${e.message}`, 1); }
    }
    else setStatus(`中止しました(${nDone} / ${units.length}か所 完了。②を押すと続きから再開します)`, nDone / units.length);
    saveMatch(m, true); refreshRP(); drawReads(); drawEditor(); drawBoard(); drawTimelines();
  } catch (e) {
    units.forEach(u => delete u._chunks);
    saveMatch(m, true); refreshRP(); drawReads(); drawEditor(); drawTimelines();
    const nDone = done.filter(Boolean).length;
    if (e.message === 'CANCELLED' || App.asrCancel) setStatus(`中止しました(${nDone} / ${units.length}か所 完了。②を押すと続きから再開します)`);
    else { console.error(e); setStatus('音声認識でエラーが発生しました:' + e.message); }
  } finally { App.asrRunning = false; const c = $('#au-cancel'); if (c) c.style.display = 'none'; }
};
// 1つのまとまりの認識結果を読みに反映
function applyASRUnit(m, u, text, chunks) {
  const inUnit = m.reads.filter(r => r.t != null && r.t >= u.s - 0.6 && r.t <= u.e + 0.3);
  const usedElsewhere = new Set(m.reads.filter(r => !inUnit.includes(r) && r.card != null).map(r => r.card));
  const pool = ALL_CARDS.filter(n => !usedElsewhere.has(n));
  if (!usedElsewhere.has(0)) pool.push(0);
  // チャンクごとに上の句と照合
  const found = [];
  for (const c of chunks) {
    const sc = scoreCards(c.text, pool);
    if (sc[0] && sc[0][1] >= 0.4 && !found.some(f => f.card === sc[0][0])) found.push({ card: sc[0][0], t: c.s, cand: sc.slice(0, 5), text: c.text });
  }
  if (!found.length) {
    const sc = scoreCards(text, pool);
    if (sc[0] && sc[0][1] >= 0.25) found.push({ card: sc[0][0], t: null, cand: sc.slice(0, 5), text });
  }
  const refine = t => {
    if (t == null) return +estimateOnset(u).toFixed(2);
    let best = t, bd = 1.0;
    for (const s of u.subs) { const d = Math.abs(s[0] - t); if (d < bd) { bd = d; best = s[0]; } }
    return +best.toFixed(2);
  };
  const targets = inUnit.filter(r => r.card == null);
  found.forEach((f, i) => {
    if (inUnit.some(r => r.card === f.card)) return; // 手動で確定済み
    let r = targets.shift();
    if (!r) { r = { id: uid(), card: null, taker: null, fault: {}, ops: [], react: {} }; m.reads.push(r); }
    r.card = f.card; r.cand = f.cand; r.asr = f.text.trim(); r.unit = [u.s, u.e];
    r.t = refine(f.t ?? r.t);
  });
  if (!found.length) targets.forEach(r => { r.asr = text.trim(); r.cand = []; });
  const selId = m.reads[App.sel]?.id;
  m.reads.sort((a, b) => (a.t ?? 1e12) - (b.t ?? 1e12));
  App.sel = selId ? m.reads.findIndex(r => r.id === selId) : App.sel;
}

// ===== カット編集 =====
const cutDefaults = m => ({ pre: 1, post: 2.5, gap: 3, jo: true, keep: 6, mode: m.reads.some(r => r.card != null) ? 'reads' : 'voice' });
function cutPanelHTML(m) {

ACT.cutSet = el => {
  const m = curMatch();
  const k = el.dataset.k;
  m.cut[k] = el.type === 'checkbox' ? el.checked : el.type === 'radio' ? el.value : Math.max(0, +el.value || 0);
  saveMatch(m); drawTimelines();
  if (k === 'mode') { const d = el.closest('details'); if (d) { d.outerHTML = cutPanelHTML(m); const nd = $$('details.panel').find(x => x.querySelector('[data-k=mode]')); if (nd) { nd.open = true; bindCommon(nd); } } return; }
  const cuts = computeCuts(m), total = cuts.reduce((a, x) => a + x[1] - x[0], 0), info = $('#cut-info');
  if (info) info.innerHTML = `元の動画 ${fmtT(vid()?.duration || m.video?.duration)} → カット後 <b>${fmtT(total)}</b>(${cuts.length}区間)`;
};
function computeCuts(m) {
  const c = { ...cutDefaults(m), ...(m.cut || {}) };
  const rp = RP || replay(m);
  const segs = [];
  // 1) 「声のある場面すべて」のときは、読み上げの声が入っている区間を残す(札の特定に失敗しても読みの場面が抜けない)
  if (c.mode !== 'reads') for (const s of m.audio?.segs || []) if (s[1] - s[0] >= 0.4) segs.push([s[0] - c.pre, s[1] + c.post]);
  // 2) 読みの一覧の各行(上の句の読み始め)と、反応の記録がある場面を残す
  m.reads.forEach((r, i) => {
    if (r.t == null) return;
    let e = r.t + (c.mode === 'reads' ? c.keep : 4);
    const kt = kimariTime(r, rp.steps[i]).t;
    if (kt != null) e = Math.max(e, kt + 1.5);
    for (const p of ['N', 'F']) { const rc = r.react?.[p]; if (rc?.touch != null) e = Math.max(e, rc.touch); if (rc?.move != null) e = Math.max(e, rc.move + 0.8); }
    segs.push([r.t - c.pre, e + c.post]);
  });
  segs.sort((a, b) => a[0] - b[0]);
  let out = [];
  for (const s of segs) {
    s[0] = Math.max(0, s[0]);
    const l = out[out.length - 1];
    if (l && s[0] <= l[1] + c.gap) l[1] = Math.max(l[1], s[1]); else out.push([...s]);
  }
  // 3) 除外した読み(序歌を含めない設定も)の場面を取り除く
  const cutOut = [];
  m.reads.forEach((r, i) => {
    if (r.t == null) return;
    if (r.excluded || (r.card === 0 && !c.jo)) {
      const next = m.reads.slice(i + 1).find(x => x.t != null);
      cutOut.push([(r.unit ? Math.min(r.unit[0], r.t) : r.t) - c.pre, next ? next.t - c.pre - 0.1 : r.t + 15]);
    }
  });
  for (const [a, b] of cutOut) {
    out = out.flatMap(([s, e]) => (e <= a || s >= b) ? [[s, e]] : [[s, a], [b, e]].filter(([x, y]) => y - x > 0.5));
  }
  return out;
}

function cutPlaybackStep(v, force) {
  const cuts = computeCuts(curMatch());

  const t = v.currentTime;
  if (cuts.some(c => t >= c[0] && t < c[1])) return;

ACT.cutList = () => {

// 再生しながら録画して書き出す
let AUDIO_ROUTE = null;
ACT.cutExport = async () => {
  const m = curMatch(), v = vid();
  if (!v) return toast('先に動画を開いてください');
  const cuts = computeCuts(m);
  if (!cuts.length) return;
  // まずは再エンコードなしの高速書き出しを試す(MP4/MOV)
  try {
    toast('カット動画を作成中…', 1500);
    const r = await exportCutFast(App.videoFile, cuts);
    downloadBlob(r.blob, `cut_${(m.date || '')}_${(m.title || 'match').replace(/[\\/:*?"<>|\s]/g, '_')}.${r.ext}`);
    toast(`書き出しました(${fmtT(r.duration)}・${(r.size / 1e9).toFixed(2)}GB)`, 4000);
    return;
  } catch (e) {
    console.warn('高速書き出しできないため録画方式に切り替え', e);
    if (e.message !== 'UNSUPPORTED' && !confirm('高速書き出しに失敗しました(' + e.message + ')。再生しながら録画する方式で書き出しますか?')) return;
  }
  const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => window.MediaRecorder?.isTypeSupported?.(t));

  const total = cuts.reduce((a, x) => a + x[1] - x[0], 0);
  if (!confirm(`この動画の形式は高速書き出しに対応していないため、再生しながら録画して書き出します。\nカット後の長さは ${fmtT(total)} で、書き出しにも同じくらいの時間がかかります。始めますか?`)) return;
  App.cutMode = false;
  const W = Math.min(1280, v.videoWidth || 1280), H = Math.round(W * (v.videoHeight || 720) / (v.videoWidth || 1280));
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  if (!AUDIO_ROUTE) {
    const ctx = new AudioContext();
    const src = ctx.createMediaElementSource(v);
    const dest = ctx.createMediaStreamDestination();
    src.connect(ctx.destination); src.connect(dest);
    AUDIO_ROUTE = { ctx, dest };
  }
  await AUDIO_ROUTE.ctx.resume();

  AUDIO_ROUTE.dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));

  const draw = () => { if (!drawing) return; g.drawImage(v, 0, 0, W, H); requestAnimationFrame(draw); };

  const seek = t => new Promise(r => { v.addEventListener('seeked', r, { once: true }); v.currentTime = t; });
  v.pause(); v.playbackRate = 1;
  draw();
  let done = 0;
  try {
    for (let i = 0; i < cuts.length; i++) {
      const [s, e] = cuts[i];
      await seek(s);
      if (i === 0) rec.start(1000); else rec.resume();
      await v.play();
      await new Promise(res => {
        const chk = () => { if (v.currentTime >= e || v.paused || v.ended) return res(); requestAnimationFrame(chk); };

    }
    await new Promise(r => { rec.onstop = r; rec.stop(); });

    const ext = mime.includes('mp4') ? 'mp4' : 'webm';

    toast('書き出しが完了しました');
  } catch (e) {
    drawing = false;
    console.error(e); alert('書き出しに失敗しました: ' + e.message);
  }

ACT.runWinProb = async el => {

ACT.runSendEval = async el => {
  const m = curMatch();
  const P = simParams(m), hands = simHands(m), rp = replay(m);
  const sends = rp.steps.flatMap(st => st.sends.map(sd => ({ ...sd, i: st.i })));
  if (!sends.length) return toast('送りの記録がありません');
  el.disabled = true;
  const res = [];
  const n = Math.max(100, Math.round(P.sims / 2));
  for (let k = 0; k < sends.length; k++) {
    const sd = sends[k];
    const pos = invertBoard(sd.boardBefore);
    const cands = Object.keys(pos).map(Number).filter(c => pos[c][0] === sd.from);
    const scores = [];
    for (const c of cands) {
      const b = { ...sd.boardBefore }; delete b[pos[c]]; b[sd.toSlot] = c;
      scores.push({ card: c, p: winProb(b, sd.unread, P, hands, sd.from, n, 1000 + k) });
      $('#se-out').innerHTML = `<div class="progress"><div style="width:${(k + scores.length / cands.length) / sends.length * 100}%"></div></div><div class="muted small">計算中… 送り ${k + 1} / ${sends.length}</div>`;
      if (scores.length % 3 === 0) await yieldUI();
    }
    scores.sort((a, b) => b.p - a.p);
    const actual = scores.find(s => s.card === sd.card);
    // 特徴
    const flags = [];
    const L = STD_KIMARI[sd.card].length;
    if (L === 1) flags.push('一字決まり');
    if (L >= 5) flags.push('大山札');
    const fr = STD_FRIENDS[sd.card].filter(f => sd.unread.has(f) && pos[f]);
    if (fr.some(f => pos[f][0] === sd.from)) flags.push('友札を分けた');
    if (fr.some(f => pos[f][0] !== sd.from)) flags.push('友札を相手陣にまとめた');
    res.push({ i: sd.i, from: sd.from, card: sd.card, actual: actual.p, best: scores[0], rank: scores.indexOf(actual) + 1, n: scores.length, top: scores.slice(0, 5), flags });

};

// ===== 取り・お手つき・送りの自動推定(映像で左右の札の枚数を数える) =====
// 取った選手は、自陣から取っても敵陣から取って1枚送っても、自分の札が必ず1枚減る。
// 読みと読みの間の落ち着いた場面で左右の枚数を数え、全体として一番つじつまの合う取りの並びを求める(ビタビ法)。
// 送った札は、試合前の映像から作った札の見本と見比べて推定する。
const AT = { W: 1280 };
function atSeek(v, t) {
  return new Promise(res => {
    const done = () => { v.removeEventListener('seeked', done); clearTimeout(to); res(); };
    const to = setTimeout(done, 3000);
    v.addEventListener('seeked', done);
    v.currentTime = clamp(t, 0, (v.duration || 1e9) - 0.05);
  });
}
function atGrab(v, w) {
  const c = document.createElement('canvas');
  c.width = w; c.height = Math.round(v.videoHeight * w / v.videoWidth);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return c;
}
// 1コマの札の枠(元の動画の座標)
function atBoxes(v, geo) {
  const c = atGrab(v, AT.W), sc = v.videoWidth / AT.W;
  const bx = visDetect(c.getContext('2d').getImageData(0, 0, c.width, c.height)).map(b => ({ x: b.x * sc, y: b.y * sc, w: b.w * sc, h: b.h * sc }));
  return geo ? bx.filter(b => { const cx = b.x + b.w / 2, cy = b.y + b.h / 2; return cx > geo.reg[0] && cx < geo.reg[2] && cy > geo.reg[1] && cy < geo.reg[3]; }) : bx;
}
const atCount = (bx, geo) => { const n = bx.filter(b => b.x + b.w / 2 < geo.seamX).length; return [n, bx.length - n]; };
// 数え違いの起こりやすさ(隠れて少なく数えるほうが多い)
function atLogF(d) {
  const p = d === 0 ? 0.62 : d === -1 ? 0.13 : d === 1 ? 0.08 : d === -2 ? 0.05 : d === 2 ? 0.02 : 0.01;
  return Math.log(p);
}

async function autoTakes(m, onProg, cancelled) {
  const v = vid();
  if (!v || !v.videoWidth) throw new Error('映像が表示できる動画を開いてください');
  if (!Object.keys(m.layout || {}).length) throw new Error('先に初期配置を入力してください');
  v.pause();
  const reads = m.reads.filter(r => r.t != null).sort((a, b) => a.t - b.t);
  const first = reads.find(r => r.card > 0);
  if (!first) throw new Error('札が特定された読みがありません');
  // --- 1) 試合開始時の盤面:中央線・範囲・札の見本
  onProg('試合開始時の盤面を調べています…', 0);
  // 数コマ見て、左右の枚数が初期配置と合うコマ(なければ一番近いコマ)を使う
  const layN = countSides(m.layout);
  let bx0 = null, full0 = null, bestDiff = 1e9;
  for (let d = 3; d <= 12; d++) {
    const t0 = first.t - d;
    if (t0 < 0.2) break;
    await atSeek(v, t0);
    const bx = atBoxes(v, null);
    if (bx.length < 4) continue;
    const sx = visGap(bx, 0) ?? v.videoWidth / 2, n = bx.filter(b => b.x + b.w / 2 < sx).length;
    const diff = Math.abs(n - layN.N) + Math.abs(bx.length - n - layN.F);
    if (diff < bestDiff) { bestDiff = diff; bx0 = bx; full0 = atGrab(v, v.videoWidth); }
    if (!diff) break;
  }
  if (!bx0 || bx0.length < 10) throw new Error('試合開始時の映像で札が見つかりませんでした');
  const seamX = visGap(bx0, 0) ?? v.videoWidth / 2, midY = visGap(bx0, 1) ?? v.videoHeight / 2;
  const cw = bx0.map(b => b.w).sort((a, b) => a - b)[bx0.length >> 1], chh = bx0.map(b => b.h).sort((a, b) => a - b)[bx0.length >> 1];
  const geo = { seamX, midY, reg: [Math.min(...bx0.map(b => b.x)) - cw, Math.min(...bx0.map(b => b.y)) - chh, Math.max(...bx0.map(b => b.x + b.w)) + cw, Math.max(...bx0.map(b => b.y + b.h)) + chh] };
  // 見本づくり:映像の枠と初期配置の札を対応づける。
  // 左右それぞれ、上半分・下半分・段ごとの枚数が初期配置と合えば、並び順で対応づける(位置の細かいずれに強い)
  const tmpl = new Map(); // 札番号 → 見本
  const boxOf = new Map();
  for (const side of ['N', 'F']) {
    const B = bx0.filter(b => (b.x + b.w / 2 < seamX) === (side === 'N'));
    const S = Object.keys(m.layout).filter(k => k[0] === side);
    if (B.length !== S.length) { // 枚数が合わない側は位置から対応づける
      visAssignSlots(bx0, seamX, midY);
      for (const b of B) { const c = m.layout[b.slot]; if (c && !boxOf.has(c)) boxOf.set(c, b); }
      continue;
    }
    const sr = k => { const c = parseSlot(k).col; return side === 'N' ? c : 11 - c; };
    const dist = b => side === 'N' ? seamX - (b.x + b.w) : b.x - seamX;
    const topS = S.filter(k => sr(k) < 6), botS = S.filter(k => sr(k) >= 6);
    const byY = B.slice().sort((a, b) => (a.y + a.h / 2) - (b.y + b.h / 2));
    for (const [sl, bx] of [[topS, byY.slice(0, topS.length)], [botS, byY.slice(topS.length)]]) {
      const bd = bx.slice().sort((a, b) => dist(a) - dist(b));
      let i = 0;
      for (let r = 0; r < 3; r++) {
        const rs = sl.filter(k => parseSlot(k).row === r).sort((a, b) => sr(a) - sr(b));
        const grp = bd.slice(i, i + rs.length).sort((a, b) => a.y - b.y); i += rs.length;

    const ts = [0.5, 1.3, 2.1, 2.9, 3.7, 4.5].map(k => tb - k).filter(t => t > ta + 2);
    if (!ts.length) ts.push((ta + tb) / 2);
    const o = [];
    for (const t of ts) { await atSeek(v, t); o.push(atCount(atBoxes(v, geo), geo)); }
    obs.push(o);

  }
  // --- 3) つじつまの合う取りの並び(状態=左の選手の枚数、右は合計から決まる)
  onProg('取りの並びを求めています…', 0.82);
  let rp = replay(m);
  const stepOf = new Map(rp.steps.map(s => [s.read, s]));
  // 各読みで考えられる出来事 { taker, fault, dN(左の増減), dT(合計の増減), lp(事前確率) }
  const choices = reads.map(r => {
    const st = stepOf.get(r);
    const fixed = hasWork(r);
    const ev = [];
    const onField = st?.onField, unknown = r.card == null || st?.noLayout;
    const add = (taker, fault, dN, dT, p) => ev.push({ taker, fault, dN, dT, lp: Math.log(p) });
    if (r.card === 0) add(null, null, 0, 0, 1);
    else if (onField || unknown) {
      add('N', null, -1, -1, 0.49); add('F', null, 0, -1, 0.49);
      // 取り+相手のお手つき(まれ)
      add('N', 'F', -2, -1, 0.005); add('F', 'N', 1, -1, 0.005);
      if (unknown) { add(null, null, 0, 0, 0.5); add(null, 'N', 1, 0, 0.02); add(null, 'F', -1, 0, 0.02); }
    } else { add(null, null, 0, 0, 0.94); add(null, 'N', 1, 0, 0.03); add(null, 'F', -1, 0, 0.03); }
    if (fixed) {
      const fN = !!r.fault?.N, fF = !!r.fault?.F;
      const keep = ev.filter(e => e.taker === (r.taker || null) && (e.fault === 'N') === fN && (e.fault === 'F') === fF);
      return keep.length ? keep : ev;

    return ev;

  };
  // 前の区間との枚数の差(手や体で長く隠れている札があっても、差には出にくい)
  const med = a => a.slice().sort((x, y) => x - y)[a.length >> 1];
  const medO = obs.map(o => [med(o.map(x => x[0])), med(o.map(x => x[1]))]);
  const dlt = (i, e) => {
    const p = i ? medO[i - 1] : cnt0, c = medO[i];
