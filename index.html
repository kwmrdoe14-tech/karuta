  // 合計は分岐ごとに違う可能性がある(札未確定の行)ので、状態は(左の枚数, 合計)
  const key = (n, T) => n * 64 + T;
  let cur = new Map([[key(lay.N, lay.N + lay.F), { lp: 0, back: [] }]]);
  const hist = [];
  for (let i = 0; i < reads.length; i++) {
    const nxt = new Map();
    for (const [k, s] of cur) {
      const n = Math.floor(k / 64), T = k % 64;
      // 決着後は変化なし(ただし映像との食い違いは同じように数える)
      const evs = (n === 0 || T - n === 0) ? [{ taker: null, fault: null, dN: 0, dT: 0, lp: 0, end: true }] : choices[i];
      for (const e of evs) {
        const n2 = n + e.dN, T2 = T + e.dT;
        const em = emis(i, n2, T2);
        if (em <= NEG / 2) continue;
        const kk = key(n2, T2), lp = s.lp + e.lp + 0.5 * em + dlt(i, e);
        if (!nxt.has(kk) || nxt.get(kk).lp < lp) nxt.set(kk, { lp, from: k, e });
      }
    }
    hist.push(nxt);
    cur = new Map([...nxt].map(([k, s]) => [k, { lp: s.lp }]));
  }
  // 逆にたどる
  let bestK = null, bestLp = NEG;
  for (const [k, s] of cur) if (s.lp > bestLp) { bestLp = s.lp; bestK = k; }
  const path = new Array(reads.length);
  for (let i = reads.length - 1; i >= 0; i--) { const s = hist[i].get(bestK); path[i] = s.e && !s.e.end ? s.e : null; bestK = s.from; }
  window.__atDebug = { lay, obs, cnt0, path: path.map(e => e && { taker: e.taker, fault: e.fault }), geo };
  // 確からしさ:その行だけ別の出来事にしたときにどれだけ合わなくなるか(前後の枚数で簡易に判定)
  const conf = reads.map((r, i) => {
    const o = obs[i], prevO = i ? obs[i - 1] : [cnt0];
    const med = a => a.slice().sort((x, y) => x - y)[a.length >> 1];
    const dN = med(o.map(x => x[0])) - med(prevO.map(x => x[0])), dF = med(o.map(x => x[1])) - med(prevO.map(x => x[1]));
    const e = path[i];
    if (!e) return 'ok';
    const expF = e.dT - e.dN;
    return dN === e.dN && dF === expF ? 'ok' : 'unsure';
  });
  // --- 4) 結果を書き込む(手で記録した行は変えない)
  let nTake = 0, nFault = 0, nUnsure = 0, nSend = 0;
  reads.forEach((r, i) => {
    const e = path[i];
    if (hasWork(r) || r.card === 0) return;
    if (!e) { // 決着後と判定された行:出札なら確認が必要
      if (stepOf.get(r)?.onField) { r.taker = null; r.fault = {}; r.autoTake = { conf: 'unsure' }; }
      return;
    }
    r.taker = e.taker; r.fault = e.fault ? { [e.fault]: true } : {};
    r.autoTake = { conf: conf[i] };
    if (e.taker) nTake++; if (e.fault) nFault++; if (conf[i] !== 'ok') nUnsure++;
  });
  if (cancelled()) return null;
  // --- 5) 送った札を推定する
  rp = replay(m);
  for (let i = 0; i < reads.length; i++) {
    if (cancelled()) break;
    const r = reads[i];
    if (!r.autoTake || (r.ops && r.ops.length)) continue;
    const st = rp.steps.find(s => s.read === r);
    if (!st) continue;
    for (const from of ['N', 'F']) {
      const need = st.need[from] || 0;
      if (!need) continue;
      const to = opp(from);
      // 送った後の落ち着いた場面(次の読みの直前)
      const tb = i + 1 < reads.length ? reads[i + 1].t : r.t + 20;
      await atSeek(v, tb - 0.8);
      const bx = atBoxes(v, geo);
      visAssignSlots(bx, seamX, midY);
      const full = atGrab(v, v.videoWidth);
      const board = st.boardAfterTake, pos = invertBoard(board);
      const fromCards = Object.keys(pos).map(Number).filter(c => pos[c][0] === from && tmpl.has(c));
      const cand = [];
      for (const b of bx.filter(b => b.side === to)) {
        const vec = visVec(visGray(visCrop(full, b, TH)));
        const sc = fromCards.map(c => [c, visDot(vec, tmpl.get(c))]).sort((a, c2) => c2[1] - a[1]);
        // 受け取った側に元からある札の見本との一致より、送り側の札との一致がはっきり高いもの
        const toBest = Object.keys(pos).map(Number).filter(c => pos[c][0] === to && tmpl.has(c)).reduce((mx, c) => Math.max(mx, visDot(vec, tmpl.get(c))), 0);
        if (sc[0] && sc[0][1] > 0.55 && sc[0][1] - toBest > 0.08 && sc[0][1] - (sc[1]?.[1] ?? 0) > 0.05) cand.push({ card: sc[0][0], s: sc[0][1], b });
      }
      cand.sort((a, c2) => c2.s - a.s);
      const used = new Set();
      r.ops = r.ops || [];
      for (const c of cand) {
        if (used.size >= need || used.has(c.card)) continue;
        // 置き場所:見えた位置のマス。空いていなければ同じ段の近い空きマス
        const occ = new Set(Object.keys(board));
        let slot = c.b.slot;
        if (!slot || occ.has(slot)) {
          const { row } = c.b.slot ? parseSlot(c.b.slot) : { row: 0 };
          for (let col = 0; col < 12 && (!slot || occ.has(slot)); col++) slot = slotKey(to, row, col);
        }
        r.ops.push({ card: c.card, to: slot });
        board[slot] = c.card; delete board[pos[c.card]];
        used.add(c.card); nSend++;
      }
      if (used.size < need) r.autoTake.conf = 'unsure';
    }
    rp = replay(m);
    onProg(`送った札を調べています… ${i + 1} / ${reads.length}`, 0.85 + 0.15 * (i + 1) / reads.length);
  }
  return { nTake, nFault, nUnsure: reads.filter(r => r.autoTake && r.autoTake.conf !== 'ok').length, nSend, cnt0, lay };
}

ACT.autoTakes = async el => {
  const m = curMatch();
  const already = m.reads.some(r => r.taker || (r.fault && (r.fault.N || r.fault.F)));
  if (!confirm(`映像から取り・お手つき・送りを推定します(数分かかります)。${already ? '\n手で記録済みの行はそのまま残します。' : ''}\n始めますか?`)) return;
  // 以前の自動推定の結果は消してからやり直す
  m.reads.forEach(r => { if (r.autoTake) { r.taker = null; r.fault = {}; r.ops = []; delete r.autoTake; } });
  let cancel = false;
  el.disabled = true;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" style="width:min(520px,94vw)"><div class="mh"><b>取りの自動推定</b><span class="spacer"></span><button data-v="cancel">中止</button></div>
    <div class="mb"><div class="small at-msg">準備しています…</div><div class="vis-bar" style="width:100%;margin-top:8px"><i class="at-bar" style="width:0%"></i></div></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('[data-v=cancel]').onclick = () => { cancel = true; };
  const prog = (t, p) => { bg.querySelector('.at-msg').textContent = t; if (p != null) bg.querySelector('.at-bar').style.width = Math.round(p * 100) + '%'; };
  try {
    const res = await autoTakes(m, prog, () => cancel);
    bg.remove();
    saveMatch(m, true); refreshRP(); drawReads(); drawEditor(); drawBoard();
    if (!res) { toast('中止しました'); return; }
    const warn = Math.abs(res.cnt0[0] - res.lay.N) > 1 || Math.abs(res.cnt0[1] - res.lay.F) > 1 ? `\n※試合開始時の映像で数えた枚数(左${res.cnt0[0]}・右${res.cnt0[1]})が初期配置(左${res.lay.N}・右${res.lay.F})と違いました。` : '';
    alert(`推定しました:取り ${res.nTake}件・お手つき ${res.nFault}件・送り ${res.nSend}件。\n黄色の行(${res.nUnsure}件)は映像で確認してください。${warn}`);
  } catch (e) {
    console.error(e); bg.remove(); alert('推定できませんでした:' + e.message);
  } finally { el.disabled = false; }
};


// ===== 起動 =====
(async () => {
  try {
    App.players = await DB.all('players');
    App.matches = await DB.all('matches');
  } catch (e) {
    $('main').innerHTML = `<div class="card-box">データの保存領域を開けませんでした(${esc(e.message)})。プライベートブラウズでは使えない場合があります。</div>`;
    return;
  }
  $$('header.app nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $('#btn-export').addEventListener('click', ACT.exportAll);
  $('#btn-import').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
  window.addEventListener('beforeunload', () => { const m = curMatch(); if (m) DB.put('matches', m); });
  window.KarutaApp = { App, DB, replay, matchStats, POEMS, STD_KIMARI, computeCuts };
  render();
})();
</script>
